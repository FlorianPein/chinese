<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinyin Lessons</title>
<meta name="theme-color" content="#b23a2e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>">
<style>
:root {
  --bg: #faf7f2; --surface: #ffffff; --surface-2: #f2ede4; --text: #1f1b16; --muted: #6b6258;
  --border: #e3dccf; --accent: #b23a2e; --accent-text: #ffffff; --good: #2f7d4f; --bad: #b23a2e;
  --warn: #9a6b00; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171411; --surface: #221e1a; --surface-2: #2c2722; --text: #f1ebe3; --muted: #a59a8d;
    --border: #3a332c; --accent: #e0675a; --accent-text: #1a0f0d; --good: #5cc28a; --bad: #e0675a;
    --warn: #e0b04f; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #171411; --surface: #221e1a; --surface-2: #2c2722; --text: #f1ebe3; --muted: #a59a8d;
  --border: #3a332c; --accent: #e0675a; --accent-text: #1a0f0d; --good: #5cc28a; --bad: #e0675a;
  --warn: #e0b04f; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 0 8px; gap: 12px; }
header h1 { font-size: 1.15rem; margin: 0; letter-spacing: .01em; }
header .stat { color: var(--muted); font-size: .9rem; white-space: nowrap; }
nav { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 8px 0 20px; }
nav a {
  flex: 1; text-align: center; padding: 8px 2px; border-radius: 9px; text-decoration: none;
  color: var(--muted); font-size: .95rem; font-weight: 500;
}
nav a.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
body.inlesson header, body.inlesson nav { display: none; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 24px 20px; box-shadow: var(--shadow);
}
.center { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tag {
  display: inline-block; font-size: .75rem; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); background: var(--surface-2); padding: 2px 8px; border-radius: 99px;
}
.py { font-size: 2rem; line-height: 1.25; font-weight: 600; margin: 14px 0 2px; overflow-wrap: anywhere; }
.num { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.en { font-size: 1.3rem; margin: 14px 0 0; }
.lit { color: var(--muted); font-style: italic; margin-top: 4px; }
.note { margin-top: 12px; font-size: .9rem; color: var(--warn); }
.prompt { font-size: 1.05rem; color: var(--muted); margin-top: 6px; }
.big-en { font-size: 1.6rem; font-weight: 600; margin: 14px 0 4px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.btn {
  border: 1px solid var(--border); background: var(--surface-2); padding: 10px 16px; border-radius: 10px;
  cursor: pointer; min-height: 44px;
}
.btn:hover { filter: brightness(.97); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.icon { padding: 10px 14px; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.bigplay { font-size: 1.8rem; padding: 14px 26px; border-radius: 16px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.grades .btn { padding: 10px 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.grades .btn small { color: var(--muted); font-size: .72rem; margin-top: 2px; }
.grades .btn.primary small { color: inherit; opacity: .85; }
a.btn { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
a.btn.primary { color: var(--accent-text); }
.grades .again { border-color: var(--bad); }
.grades .good { border-color: var(--good); }
input[type=text] {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); font-size: 1.2rem; margin-top: 16px; text-align: center;
}
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.result { margin-top: 14px; font-weight: 600; }
.result.ok { color: var(--good); }
.result.no { color: var(--bad); }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.options.one { grid-template-columns: 1fr; }
.options.three { grid-template-columns: repeat(3, 1fr); }
.options .btn.playing { outline: 2px solid var(--accent); }
.options .btn { font-size: 1.35rem; padding: 14px 8px; }
.options.text .btn { font-size: 1.05rem; }
.btn.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 15%, var(--surface)); }
.btn.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, var(--surface)); }
.btn.right:disabled, .btn.wrong:disabled { opacity: 1; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item {
  display: flex; gap: 12px; align-items: flex-start; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
}
.item .main { flex: 1; min-width: 0; }
.item .p { font-weight: 600; font-size: 1.15rem; }
.item .e { color: var(--text); }
.item .l { color: var(--muted); font-size: .85rem; font-style: italic; }
.item .btns { display: flex; gap: 6px; }
.item .btn { min-height: 40px; padding: 6px 10px; }
.lesson {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
}
.lesson input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.lesson .main { flex: 1; min-width: 0; }
.lesson .t { font-weight: 600; }
.lesson a { color: var(--accent); font-size: .9rem; white-space: nowrap; }
h2 { font-size: 1rem; margin: 26px 0 10px; color: var(--muted); font-weight: 600; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.sync-form input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; margin: 4px 0 10px; }
.sync-form label { display: block; }
.setting input[type=number] {
  width: 72px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
}
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: -8px 0 16px; }
.progress > div { height: 100%; background: var(--accent); transition: width .3s; }
.kbd { font-size: .75rem; color: var(--muted); margin-top: 14px; }

/* learn path */
.topic h2 { margin-bottom: 2px; color: var(--text); }
.lrow {
  display: flex; align-items: center; gap: 12px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; text-decoration: none;
}
.lrow.next { border-color: var(--accent); box-shadow: var(--shadow); }
.lrow .ic {
  flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); font-weight: 700; color: var(--muted);
}
.lrow.done .ic { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.lrow.next .ic { background: var(--accent); color: var(--accent-text); }
.lrow .main { flex: 1; min-width: 0; }
.lrow .t { font-weight: 600; }
.lrow .go { color: var(--accent); font-weight: 600; font-size: .9rem; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }

/* lesson player */
.ltop { display: flex; align-items: center; gap: 8px; padding: 14px 0 12px; }
.ltop .progress { flex: 1; margin: 0; height: 10px; }
.ltop .btn { min-height: 40px; padding: 6px 10px; font-size: 1.1rem; color: var(--muted); }
.step { text-align: center; min-height: 300px; }
.step h3 { font-size: 1.3rem; margin: 10px 0 6px; }
.step .text { text-align: left; margin: 10px auto 0; max-width: 34em; }
.step .text p { margin: 0 0 10px; }
.step .sub { color: var(--muted); font-size: .9rem; margin-top: 18px; }
.tonebig { display: flex; justify-content: center; margin-top: 6px; color: var(--accent); }
.sylrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; align-items: stretch; }
.syl {
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px;
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px; padding: 8px 10px; cursor: pointer;
}
.syl svg { color: var(--muted); }
.syl .sp { font-size: 1.3rem; font-weight: 600; line-height: 1.2; }
.syl .sl { font-size: .72rem; color: var(--muted); max-width: 7em; line-height: 1.2; }
.syl.on { border-color: var(--accent); }
.syl.on svg { color: var(--accent); }
.syl.playing { outline: 2px solid var(--accent); }
.tonebtn { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tonebtn svg { color: var(--accent); }
.tonebtn span { font-size: .95rem; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.chip {
  display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border);
  background: var(--surface-2); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: 1.1rem; font-weight: 600;
}
.chip small { font-weight: 400; font-size: .75rem; color: var(--muted); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.match .btn { min-height: 52px; padding: 8px; }
.match .btn.py-opt { font-size: 1.2rem; font-weight: 600; }
.match .btn.sel { border-color: var(--accent); outline: 2px solid var(--accent); }
.match .btn.done { opacity: .35; }
.answer {
  min-height: 58px; border-bottom: 2px solid var(--border); margin: 18px 0 14px; padding: 6px 0;
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center;
}
.bank { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tile {
  border: 1px solid var(--border); background: var(--surface); border-bottom-width: 3px; border-radius: 10px;
  padding: 8px 14px; font-size: 1.2rem; font-weight: 600; cursor: pointer; min-height: 44px;
}
.tile.used { visibility: hidden; }
.footer { position: sticky; bottom: 0; padding: 14px 0 16px; margin-top: 14px; background: var(--bg); }
.footer.ok, .footer.no { border-radius: 16px; padding: 14px 16px 16px; }
.footer.ok { background: color-mix(in srgb, var(--good) 14%, var(--bg)); }
.footer.no { background: color-mix(in srgb, var(--bad) 14%, var(--bg)); }
.fbhead { font-weight: 700; font-size: 1.1rem; }
.footer.ok .fbhead { color: var(--good); }
.footer.no .fbhead { color: var(--bad); }
.fbans { margin: 4px 0 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.fbans b { font-size: 1.2rem; }
.fbans .btn { min-height: 36px; padding: 4px 10px; }
.rec { margin-top: 18px; }
.btn.sel { border-color: var(--accent); outline: 2px solid var(--accent); }
.lrow.planned { opacity: .6; padding: 8px 14px; }
.lrow.planned .ic { width: 28px; height: 28px; font-size: .85rem; }
details.later { margin-top: 26px; }
details.later summary { cursor: pointer; color: var(--muted); font-weight: 600; }
details.later .list { margin-top: 10px; }
.chart { display: grid; gap: 6px; margin: 16px auto 0; max-width: 420px; align-items: stretch; }
.chart button {
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; cursor: pointer;
  min-height: 48px; padding: 6px 8px;
}
.chart .chead { display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border-color: transparent; color: var(--muted); font-size: .75rem; }
.chart .chead svg { color: var(--accent); }
.chart .rhead { font-weight: 600; background: transparent; text-align: left; }
.chart .ccell { font-size: 1.25rem; font-weight: 600; }
.chart .playing { outline: 2px solid var(--accent); }
.done-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.done-stats div { background: var(--surface-2); border-radius: 12px; padding: 12px 6px; }
.done-stats b { display: block; font-size: 1.4rem; }
@media (max-width: 420px) {
  .py { font-size: 1.7rem; }
  .kbd { display: none; }
  nav a { font-size: .85rem; }
  .syl { min-width: 56px; padding: 6px 8px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🀄 Pinyin</h1>
    <span class="stat" id="stat"></span>
  </header>
  <nav>
    <a href="#learn" data-tab="learn">Learn</a>
    <a href="#practice" data-tab="practice">Practice</a>
    <a href="#listen" data-tab="listen">Listen</a>
    <a href="#settings" data-tab="settings" title="Settings">⚙︎</a>
  </nav>
  <main id="view"></main>
</div>

<script>
"use strict";

// ---------- storage (per browser; synced through GitHub, or export/import to move between devices) ----------
const KEY = "pinyin-flashcards-v1";
// cards: word flashcards from an earlier version of the course, kept so older copies of the app still sync
const DEFAULT_STATE = { unlocked: [], cards: {}, lessons: {}, removedLessons: {}, log: [], settings: { numbers: true } };
// Activity log for "Copy progress for Claude": finished lessons, wrong answers, practice rounds.
const LOG_MAX = 3000;
function logEvent(e) {
  state.log.push({ d: new Date().toISOString().slice(0, 19), ...e });
  if (state.log.length > LOG_MAX) state.log.splice(0, state.log.length - LOG_MAX);
}
let state = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) return { ...structuredClone(DEFAULT_STATE), ...s, settings: { ...DEFAULT_STATE.settings, ...s.settings } };
  } catch (e) { /* storage unavailable */ }
  return structuredClone(DEFAULT_STATE);
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
function save() { saveLocal(); scheduleSync(); }
const nowIso = () => new Date().toISOString();

// ---------- sync between devices, through a file on a branch of the GitHub repo ----------
// The token stays in this browser (its own key, so Export never contains it).
const SYNC_KEY = "pinyin-sync", SYNC_BRANCH = "progress", SYNC_FILE = "progress.json";
const SHARED = ["lessons", "removedLessons", "cards", "unlocked", "log"];   // settings stay per device
let syncCfg = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } })();
let syncTimer = null, syncing = null, syncAgain = false;
function saveSyncCfg() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); } catch (e) { /* ignore */ } }
function scheduleSync() {
  if (!syncCfg.token) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 5000);
}
// JSON with sorted keys, to tell whether two states really differ
const stableJson = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x)
  ? Object.fromEntries(Object.entries(x).sort(([p], [q]) => p < q ? -1 : p > q ? 1 : 0)) : x);
const pickShared = st => Object.fromEntries(SHARED.map(k => [k, st[k] || (k === "unlocked" || k === "log" ? [] : {})]));

// Nothing done on either device is lost: lessons are combined (a lesson unticked
// later than it was done stays removed), each flashcard keeps its latest review,
// and the logs are joined.
function mergeState(a, b) {
  const removed = { ...(b.removedLessons || {}) };
  for (const [id, at] of Object.entries(a.removedLessons || {})) if (!removed[id] || at > removed[id]) removed[id] = at;
  const la = a.lessons || {}, lb = b.lessons || {}, lessons = {};
  for (const id of new Set([...Object.keys(la), ...Object.keys(lb)])) {
    const x = la[id], y = lb[id];
    const st = x && y ? { ...((y.at || "") > (x.at || "") ? y : x),
                          done: x.done < y.done ? x.done : y.done, last: x.last > y.last ? x.last : y.last,
                          best: Math.max(x.best || 0, y.best || 0), times: Math.max(x.times || 0, y.times || 0) } : x || y;
    if (removed[id] && removed[id] > (st.at || "")) continue;
    lessons[id] = st;
    delete removed[id];
  }
  const cards = { ...(b.cards || {}) };
  const weight = c => [c.at || "", c.reps + c.lapses];
  for (const [id, c] of Object.entries(a.cards || {})) {
    const o = cards[id], [ta, na] = weight(c), [tb, nb] = o ? weight(o) : ["", -1];
    if (!o || ta > tb || (ta === tb && na > nb)) cards[id] = c;
  }
  const unlocked = [...new Set([...(a.unlocked || []), ...(b.unlocked || [])])].filter(id => !removed[id]);
  const seen = new Set(), log = [];
  for (const e of [...(b.log || []), ...(a.log || [])]) {
    const k = JSON.stringify(e);
    if (!seen.has(k)) { seen.add(k); log.push(e); }
  }
  log.sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0);
  return { lessons, removedLessons: removed, cards, unlocked, log: log.slice(-LOG_MAX) };
}

async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${syncCfg.repo}/${path}`, {
    cache: "no-store", ...opts,
    headers: { Authorization: `Bearer ${syncCfg.token}`, Accept: "application/vnd.github+json",
               ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  if (r.status === 404 && !opts.method) return null;
  if (!r.ok) { const e = new Error(`GitHub ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}
const toB64 = str => {
  const b = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return btoa(bin);
};
const fromB64 = str => new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g, "")), c => c.charCodeAt(0)));
async function readRemote() {
  const f = await gh(`contents/${SYNC_FILE}?ref=${SYNC_BRANCH}`);
  if (!f) return { sha: null, data: {}, branch: !!(await gh(`branches/${SYNC_BRANCH}`)) };
  const content = f.content || (await gh(`git/blobs/${f.sha}`)).content;   // files over 1 MB come without content
  return { sha: f.sha, data: JSON.parse(fromB64(content)), branch: true };
}
async function writeRemote(remote, data) {
  const content = JSON.stringify(data, null, 1) + "\n";
  const message = `Progress from ${syncCfg.device || "a device"}`;
  if (!remote.branch) {   // first sync: a branch of its own, holding only this file
    const tree = await gh("git/trees", { method: "POST", body: JSON.stringify({ tree: [{ path: SYNC_FILE, mode: "100644", type: "blob", content }] }) });
    const commit = await gh("git/commits", { method: "POST", body: JSON.stringify({ message, tree: tree.sha, parents: [] }) });
    return gh("git/refs", { method: "POST", body: JSON.stringify({ ref: `refs/heads/${SYNC_BRANCH}`, sha: commit.sha }) });
  }
  return gh(`contents/${SYNC_FILE}`, { method: "PUT", body: JSON.stringify(
    { message, content: toB64(content), branch: SYNC_BRANCH, ...(remote.sha ? { sha: remote.sha } : {}) }) });
}
function syncError(e) {
  if (e.status === 401) return "GitHub didn't accept the token. It may have expired: make a new one and connect again.";
  if (e.status === 403 || e.status === 404) return `The token can't write to ${syncCfg.repo}. Check that it has access to this repository, with Contents: Read and write.`;
  if (e.status) return `GitHub answered with error ${e.status}. It will try again later.`;
  return "Couldn't reach GitHub (offline?). It will try again later.";
}
async function syncNow() {
  clearTimeout(syncTimer); syncTimer = null;
  if (!syncCfg.token || !DATA.lessons.length) return;
  if (syncing) { syncAgain = true; return syncing; }
  syncing = (async () => {
    for (let attempt = 0; ; attempt++) {
      try {
        const remote = await readRemote();
        const before = stableJson(pickShared(state));
        Object.assign(state, mergeState(state, remote.data));
        tidyLessons();
        saveLocal();
        const shared = pickShared(state);
        if (stableJson(shared) !== stableJson(pickShared(remote.data)))
          await writeRemote(remote, { v: 1, updated: nowIso(), ...shared });
        syncCfg.last = nowIso(); syncCfg.error = "";
        if (stableJson(shared) !== before) refreshAfterSync();
        break;
      } catch (e) {
        if ((e.status === 409 || e.status === 422) && attempt < 3) continue;   // the other device wrote first: merge again
        syncCfg.error = syncError(e);
        break;
      }
    }
    saveSyncCfg();
    document.querySelectorAll("[data-sync-status]").forEach(el => el.innerHTML = syncStatus());
  })();
  await syncing;
  syncing = null;
  if (syncAgain) { syncAgain = false; syncNow(); }
}
function syncStatus() {
  if (syncCfg.error) return `⚠ ${esc(syncCfg.error)}`;
  return syncCfg.last ? `Last synced ${new Date(syncCfg.last).toLocaleString()}.` : "Not synced yet.";
}
function refreshAfterSync() {
  updateStat();

// ---------- pinyin answer checking: tone marks or numbers both work ----------
const MARKS = { "\u0304": 1, "\u0301": 2, "\u030c": 3, "\u0300": 4 };
function canon(s) {
  let letters = "", tones = "";
  const t = s.normalize("NFD").toLowerCase().replace(/u:/g, "v");
  for (const ch of t) {
    if (MARKS[ch]) tones += MARKS[ch];
    else if (ch === "\u0308") letters = letters.slice(0, -1) + "v";   // ü
    else if (/[1-4]/.test(ch)) tones += ch;                           // 5 / 0 = neutral
    else if (/[a-z]/.test(ch)) letters += ch;
  }
  return { letters, tones };
}
function checkAnswer(given, item) {
  const a = canon(given), b = canon(item.pinyin);
  if (a.letters === b.letters && a.tones === b.tones) return "ok";
  if (a.letters === b.letters) return "tones";
  return "no";
}
const samePinyin = (a, b) => { const x = canon(a), y = canon(b); return x.letters === y.letters && x.tones === y.tones; };
// "Hǎo, wǒ hē." -> ["hǎo", "wǒ", "hē"]
const tilesOf = text => (text.match(/[^\s,.!?:;，。！？：；]+/g) || []).map(w => w[0].toLowerCase() + w.slice(1));
function wordFor(w) {   // the word (or sound) item a tile or chip can play
  return DATA.items.find(i => i.kind === "word" && samePinyin(i.pinyin, w))
      || DATA.items.find(i => i.kind === "sound" && samePinyin(i.pinyin, w));
}

// ---------- audio ----------
const audioCache = {};
let current = null, seqToken = 0;
function audioFor(id) {
  if (!audioCache[id]) { audioCache[id] = new Audio(`audio/${id}.mp3${byId[id] ? `?v=${byId[id].v}` : ""}`); audioCache[id].preload = "auto"; }
  return audioCache[id];
}
function stopAudio() {
  seqToken++;
  if (current) current.pause();
  document.querySelectorAll(".playing").forEach(e => e.classList.remove("playing"));
}
function play(id, slow) {
  stopAudio();
  const a = audioFor(id);
  a.preservesPitch = true;
  a.playbackRate = slow ? 0.7 : 1;
  a.currentTime = 0;
  current = a;
  a.play().catch(() => {});
}
async function playSeq(ids, marks) {   // a row of sounds, one after another; marks[n] lights up while ids[n] plays
  stopAudio();
  const my = seqToken;
  for (const [n, id] of ids.entries()) {
    if (my !== seqToken) return;
    const btn = marks ? marks[n] : view.querySelector(`.syl[data-play="${id}"], .ccell[data-play="${id}"]`);
    if (btn) btn.classList.add("playing");
    await new Promise(done => {
      const a = audioFor(id);
      a.playbackRate = 1; a.currentTime = 0; current = a;
      a.onended = done; a.onerror = done;
      a.play().catch(done);
    });
    if (btn) btn.classList.remove("playing");
    await new Promise(r => setTimeout(r, 250));
  }
}

// ---------- tone shapes ----------
const TONE_NAME = ["", "1st tone", "2nd tone", "3rd tone", "4th tone", "neutral"];
function toneSvg(tone, w) {
  // 5 pitch levels (1 low … 5 high), drawn like the usual tone charts
  const y = L => 26 - (L - 1) * 5.5;
  const pts = { 1: [[6, 5], [34, 5]], 2: [[6, 3], [34, 5]], 3: [[6, 2.2], [17, 1], [24, 1.2], [34, 3.6]], 4: [[6, 5], [34, 1]] }[tone];
  const grid = [1, 2, 3, 4, 5].map(L => `<line x1="2" x2="38" y1="${y(L)}" y2="${y(L)}" stroke="currentColor" stroke-opacity=".15" stroke-width="1"/>`).join("");
  const shape = pts
    ? `<polyline points="${pts.map(([x, L]) => `${x},${y(L)}`).join(" ")}" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`
    : `<circle cx="20" cy="${y(2.5)}" r="3.2" fill="currentColor"/>`;
  return `<svg width="${w}" height="${w * 0.75}" viewBox="0 0 40 30" aria-hidden="true">${grid}${shape}</svg>`;
}

// ---------- Copy progress for Claude ----------
// A readable summary plus the exact new log entries since the last copy, as JSON.
function progressReport() {
  const now = new Date().toISOString().slice(0, 16).replace("T", " ");
  const since = state.copiedAt || "";
  const fresh = state.log.filter(e => e.d > since);
  const lines = [`## Pinyin progress (copied ${now} UTC${since ? `, new since ${since.replace("T", " ")}` : ""})`, ""];

  const done = DATA.lessons.filter(l => state.lessons[l.id]);
  lines.push(`**Lessons done:** ${done.length ? done.map(l => {
    const st = state.lessons[l.id];
    return `${l.id} (${st.done}, best ${st.best}%, ${st.times}×)`;
  }).join(", ") : "none yet"}`);

  const runs = fresh.filter(e => e.t === "lesson");
  if (runs.length) lines.push(`**Lessons since last copy:** ${runs.map(e => `${e.lesson} ${e.score}% in ${e.minutes} min`).join(", ")}`);

  const misses = state.log.filter(e => e.t === "mistake");
  if (misses.length) {
    const count = {};
    for (const e of misses) { const k = `${e.type}: ${e.want} → ${e.got}`; count[k] = (count[k] || 0) + 1; }
    const top = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 12);
    lines.push("", `**Most frequent mistakes** (all time, ${misses.length} in total):`);
    top.forEach(([k, n]) => lines.push(`- ${n}× ${k}`));
  }

  flushPractice();
  const rounds = state.log.filter(e => e.t === "practice");
  if (rounds.length) {
    const week = new Date(Date.now() - 7 * DAY).toISOString().slice(0, 16);
    const sum = list => list.reduce((a, e) => [a[0] + e.right, a[1] + e.total], [0, 0]);
    const [r, n] = sum(rounds), [rw, nw] = sum(rounds.filter(e => e.d > week));
    lines.push("", `**Practice:** ${n} questions in total (${Math.round(100 * r / n)}% right), ${nw} in the last 7 days${nw ? ` (${Math.round(100 * rw / nw)}% right)` : ""}.`);
  }

  const data = { v: 1, copied: now, since, lessons: state.lessons, log: fresh };
  lines.push("", "```json", JSON.stringify(data), "```");
  return lines.join("\n");
}
async function copyProgress() {
  const text = progressReport();
  const msgs = view.querySelectorAll("[data-copy-msg]");
  const mark = () => { state.copiedAt = new Date().toISOString().slice(0, 19); save(); };
  try {
    await navigator.clipboard.writeText(text);
    mark();
    msgs.forEach(m => m.textContent = "Copied. Paste it into your chat with Claude.");
  } catch {
    // no clipboard access (e.g. some phones): show the text to copy by hand
    msgs.forEach(m => {
      m.innerHTML = `Select all and copy:<textarea readonly style="width:100%;height:160px;margin-top:6px;font:12px monospace">${esc(text)}</textarea>`;
      const ta = m.querySelector("textarea"); ta.focus(); ta.select();
    });
    mark();
  }
}

// ---------- Lesson player ----------
const EXERCISES = new Set(["hear", "tone", "same", "odd", "order", "audio", "meaning", "pinyin", "match", "build", "type"]);
const soundId = (base, tone) => `s-${base.replace("ü", "v")}${tone}`;
const chartIds = s => s.syllables.flatMap(b => s.tones.map(t => soundId(b, t)));
let L = null;   // the running lesson
function stepAudio(s) {
  const ids = [s.item, s.play, s.odd, ...(s.items || []), ...(s.pair || []), ...(s.sounds || []), ...(["meaning", "audio"].includes(s.type) ? s.options : []),
               ...(s.rows || []).flat(), ...(s.type === "chart" ? chartIds(s) : [])];
  return ids.filter(id => id && byId[id]);
}
function startLesson(id) {
  const lesson = DATA.lessons.find(l => l.id === id);
  if (!lesson) { location.hash = "#learn"; return; }
  L = { lesson, queue: lesson.steps.map((s, i) => ({ s, i, tries: 0 })), pos: 0, wrong: new Set(), started: Date.now() };
  for (const s of lesson.steps) stepAudio(s).forEach(audioFor);   // preload
  renderStep();
}
function renderStep() {
  keyHandler = null;
  if (L.pos >= L.queue.length) return finishLesson();
  const entry = L.queue[L.pos];
  view.innerHTML = `<div class="ltop"><button class="btn ghost" id="quit" title="Quit lesson">✕</button>
      <div class="progress"><div style="width:${100 * L.pos / L.queue.length}%"></div></div></div>
    <div class="card step" id="card"></div><div class="footer" id="footer"></div>`;
  $("#quit").onclick = () => { if (confirm("Quit this lesson? You can start it again any time.")) { L = null; location.hash = "#learn"; } };
  window.scrollTo(0, 0);
  STEPS[entry.s.type](entry.s, entry);
}
function nextStep() { stopAudio(); L.pos++; renderStep(); }
function footerButton(text, onClick, disabled) {
  const f = $("#footer");
  f.className = "footer";
  f.innerHTML = `<button class="btn primary wide" id="go"${disabled ? " disabled" : ""}>${text}</button>`;
  $("#go").onclick = onClick;
  return $("#go");
}
function continueFooter(text = "Continue") {
  footerButton(text, nextStep).focus();
  keyHandler = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nextStep(); } };
}
const answerLine = item => `<div class="fbans"><b>${esc(item.pinyin)}</b><span>${esc(label(item))}</span>${audioButtons(item.id)}</div>`;
// Show right/wrong. A wrong exercise comes back at the end of the lesson (up to twice).
function judge(entry, ok, { title, reveal = "", playId = null, requeue = true } = {}) {
  if (!ok) {
    logMistake(entry);
    L.wrong.add(entry.i);
    if (requeue && entry.tries < 2) L.queue.push({ ...entry, tries: entry.tries + 1 });
  }
  const f = $("#footer");
  f.className = "footer " + (ok ? "ok" : "no");
  f.innerHTML = `<div class="fbhead">${title || (ok ? "✓ Correct!" : "✗ Not quite")}</div>${reveal}
    <button class="btn primary wide" id="go">Continue</button>`;
  $("#go").onclick = nextStep;
  $("#go").focus();
  if (playId) play(playId);
  keyHandler = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nextStep(); }
    else if (e.key === "p" && playId) play(playId);
  };
}
function logMistake(entry) {
  const s = entry.s, g = entry.given;
  const it = byId[s.item || s.play];
  const want = s.pair ? s.pair.map(id => byId[id].pinyin).join(" / ") + (byId[s.pair[0]].pinyin === byId[s.pair[1]].pinyin ? " (same)" : " (different)")
             : s.type === "odd" ? `${byId[s.play].pinyin} ×2, odd one ${byId[s.odd].pinyin}`
             : s.type === "order" ? s.sounds.map(id => byId[id].pinyin).join(" ")
             : s.type === "match" ? s.items.map(id => byId[id].pinyin).join(", ")
             : it ? it.pinyin + (s.type === "meaning" ? ` = ${it.english}` : "") : "";
  const got = g === undefined ? "" : s.type === "tone" ? TONE_NAME[g]
            : s.type === "meaning" ? (byId[g] ? byId[g].english : g)
            : s.type === "audio" ? (byId[g] ? byId[g].pinyin : g)
            : s.type === "odd" ? `picked ${byId[entry.seq[g]].pinyin}`
            : s.type === "same" ? (g === "same" ? "said same" : "said different") : String(g);
  logEvent({ t: "mistake", lesson: L.lesson.id, step: entry.i, type: s.type, want, got, retry: entry.tries });
}
// Multiple choice: buttons with data-k; isRight(k) says which is correct.
function choose(entry, isRight, after) {
  const btns = [...view.querySelectorAll("[data-k]")];
  let answered = false;
  const pick = b => {
    if (answered) return; answered = true;
    const ok = isRight(b.dataset.k);
    entry.given = b.dataset.k;
    btns.forEach(x => { x.disabled = true; if (isRight(x.dataset.k)) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    after(ok);
  };
  btns.forEach(b => b.onclick = () => pick(b));
  footerButton("Choose an answer", null, true);
  keyHandler = e => {
    const n = +e.key;
    if (n >= 1 && n <= btns.length) pick(btns[n - 1]);
    else if (e.key === "p" && entry.seq) playSeq(entry.seq, entry.marks);
    else if (e.key === "p" && entry.audio) play(entry.audio);
  };
}
const bigPlay = id => `<div class="row"><button class="btn bigplay" data-play="${id}" title="Play again">🔊</button>
  <button class="btn icon" data-slow="${id}" title="Play slowly">🐢</button></div>`;

const STEPS = {
  intro(s) {
    $("#card").innerHTML = `${s.tone ? `<div class="tonebig">${toneSvg(s.tone, 110)}</div>` : `<span class="tag">tip</span>`}
      <h3>${esc(s.title)}</h3><div class="text">${fmt(s.text)}</div>${(s.rows || []).map(r => sylRow(r)).join("")}`;
    continueFooter();
  },
  chart(s) {
    // syllables down, tones across; a row or column header plays the whole line
    $("#card").innerHTML = `<span class="tag">the chart</span><h3>${esc(s.title)}</h3>${s.text ? `<div class="text">${fmt(s.text)}</div>` : ""}
      <div class="chart" style="grid-template-columns: auto repeat(${s.tones.length}, 1fr)"><span></span>${
        s.tones.map(t => `<button class="chead" data-seq="${s.syllables.map(b => soundId(b, t)).join(" ")}" title="Play the column">${toneSvg(t, 34)}<span>${TONE_NAME[t]}</span></button>`).join("")}${
        s.syllables.map(b => `<button class="rhead" data-seq="${s.tones.map(t => soundId(b, t)).join(" ")}" title="Play the row">${esc(b)} ▶</button>` +
          s.tones.map(t => `<button class="ccell" data-play="${soundId(b, t)}">${esc(byId[soundId(b, t)].pinyin)}</button>`).join("")).join("")}</div>`;
    continueFooter();
  },
  same(s, entry) {
    const [a, b] = s.pair, isSame = byId[a].pinyin === byId[b].pinyin;
    entry.seq = [a, b];
    $("#card").innerHTML = `<span class="tag">listen</span><div class="prompt">Two sounds. Are they the same?</div>
      <div class="row"><button class="btn bigplay" data-seq="${a} ${b}" title="Play both again">🔊 🔊</button></div>
      <div class="options"><button class="btn" data-k="same">Same</button><button class="btn" data-k="diff">Different</button></div>`;
    playSeq([a, b]);
    choose(entry, k => (k === "same") === isSame, ok => judge(entry, ok, {
      title: ok ? `✓ Correct: ${isSame ? "the same" : "different"}` : `✗ They were ${isSame ? "the same" : "different"}`,
      reveal: `<div class="fbans">${[a, b].map(x => `<b>${esc(byId[x].pinyin)}</b><button class="btn icon" data-play="${x}" title="Play">🔊</button>`).join("")}</div>` }));
  },
  odd(s, entry) {
    // three sounds, two of them the same: which one is different?
    const pos = Math.floor(Math.random() * 3), ids = [s.play, s.play, s.play];
    ids[pos] = s.odd;
    entry.seq = ids;
    $("#card").innerHTML = `<span class="tag">odd one out</span><div class="prompt">Three sounds. Which one is different?</div>
      <div class="row"><button class="btn bigplay" id="again" title="Play all three again">🔊 🔊 🔊</button></div>
      <div class="options three">${ids.map((_, n) => `<button class="btn" data-k="${n}">${n + 1}</button>`).join("")}</div>`;
    entry.marks = [...view.querySelectorAll("[data-k]")];
    $("#again").onclick = () => playSeq(ids, entry.marks);
    playSeq(ids, entry.marks);
    choose(entry, k => +k === pos, ok => judge(entry, ok, {
      reveal: `<div class="fbans">${ids.map((x, n) => `<b>${n + 1}: ${esc(byId[x].pinyin)}</b><button class="btn icon" data-play="${x}" title="Play">🔊</button>`).join("")}</div>` }));
  },
  order(s, entry) {
    // two to four sounds in a row: which Pinyin says them, in that order?
    const right = s.sounds.map(id => byId[id].pinyin).join(" ");
    entry.seq = s.sounds;
    $("#card").innerHTML = `<span class="tag">listen</span><div class="prompt">${["", "", "Two", "Three", "Four"][s.sounds.length]} sounds in a row. What do you hear?</div>
      <div class="row"><button class="btn bigplay" data-seq="${s.sounds.join(" ")}" title="Play again">${"🔊 ".repeat(s.sounds.length).trim()}</button></div>
      <div class="options${s.options.length === 3 ? " one" : ""}">${shuffle(s.options).map(o =>
        `<button class="btn" data-k="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    playSeq(s.sounds);
    choose(entry, k => k === right, ok => judge(entry, ok, {
      reveal: `<div class="fbans"><b>${esc(right)}</b><button class="btn icon" data-seq="${s.sounds.join(" ")}" title="Play">🔊</button></div>` }));
  },
  audio(s, entry) {
    // see the Pinyin, listen to the options, pick the one that says it
    const it = byId[s.item];
    $("#card").innerHTML = `<span class="tag">read and listen</span><div class="prompt">Which one says</div>${pinyinBlock(it)}
      <div class="options">${shuffle(s.options).map((id, n) => `<button class="btn" data-pick="${id}">🔊 ${n + 1}</button>`).join("")}</div>
      <div class="muted small" style="margin-top:10px">Tap each to listen, then press Check.</div>`;
    const btns = [...view.querySelectorAll("[data-pick]")];
    let picked = null, done = false;
    const go = footerButton("Check", () => check(), true);
    const select = b => {
      play(b.dataset.pick);
      if (done) return;
      btns.forEach(x => x.classList.toggle("sel", x === b));
      picked = b.dataset.pick; go.disabled = false;
    };
    btns.forEach(b => b.onclick = () => select(b));
    const check = () => {
      if (done || !picked) return; done = true;
      btns.forEach(b => {
        b.classList.remove("sel");
        b.textContent = `🔊 ${byId[b.dataset.pick].pinyin}`;
        if (b.dataset.pick === it.id) b.classList.add("right");
        else if (b.dataset.pick === picked) b.classList.add("wrong");
      });
      entry.given = picked;
      judge(entry, picked === it.id, { reveal: answerLine(it) });
    };
    keyHandler = e => { const n = +e.key; if (n >= 1 && n <= btns.length) select(btns[n - 1]); else if (e.key === "Enter") check(); };
  },
  new(s) {
    const it = byId[s.item];
    let extra = "";
    if (it.kind === "word" && it.syllables.length === 1) {
      const [base, tone] = it.syllables[0];
      const ids = [1, 2, 3, 4].map(t => `s-${base.replace("ü", "v")}${t}`).filter(id => byId[id]);
      extra = `<div class="sub">The same syllable in all four tones. Only one of them means <i>${esc(it.english)}</i>:</div>
        ${sylRow(ids, `s-${base.replace("ü", "v")}${tone}`)}`;
    } else if (it.kind === "phrase") {
      extra = `<div class="sub">Word by word:</div><div class="chips">${tilesOf(it.pinyin).map(w => {
        const wi = wordFor(w);
        return `<button class="chip"${wi ? ` data-play="${wi.id}"` : " disabled"}>${esc(w)}<small>${wi ? esc(wi.english) : ""}</small></button>`;
      }).join("")}</div>`;
    }
    $("#card").innerHTML = `<span class="tag">new ${it.kind}</span>${pinyinBlock(it)}
      <div class="row">${audioButtons(it.id)}</div>${meaningBlock(it)}${extra}`;
    play(it.id);
    continueFooter();
    const prev = keyHandler;
    keyHandler = e => { if (e.key === "p") play(it.id); else prev(e); };
  },
  hear(s, entry) {
    const it = byId[s.play];
    entry.audio = s.play;
    $("#card").innerHTML = `<span class="tag">listen</span><div class="prompt">What do you hear?</div>${bigPlay(s.play)}
      <div class="options${s.options.length === 3 ? " one" : ""}">${shuffle(s.options).map(o =>
        `<button class="btn" data-k="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    play(s.play);
    choose(entry, k => k === it.pinyin, ok => judge(entry, ok, { reveal: answerLine(it) }));
  },
  tone(s, entry) {
    const it = byId[s.play], right = it.syllables[0][1];
    entry.audio = s.play;
    $("#card").innerHTML = `<span class="tag">listen</span><div class="prompt">Which tone is it?</div>${bigPlay(s.play)}
      <div class="options">${s.options.map(t => `<button class="btn tonebtn" data-k="${t}">${toneSvg(t, 44)}<span>${TONE_NAME[t]}</span></button>`).join("")}</div>`;
    play(s.play);
    choose(entry, k => +k === right, ok => judge(entry, ok, { reveal: answerLine(it) }));
  },
  meaning(s, entry) {
    const it = byId[s.item];
    const front = s.from === "audio"
      ? `<div class="prompt">What does it mean?</div>${bigPlay(it.id)}`
      : `${pinyinBlock(it)}<div class="prompt">What does it mean?</div>`;

    $("#card").innerHTML = `<span class="tag">${s.from === "audio" ? "listen" : "read"}</span>${front}
      <div class="options one text">${shuffle(s.options).map(id => `<button class="btn" data-k="${id}">${esc(byId[id].english)}</button>`).join("")}</div>`;
    if (s.from === "audio") play(it.id);
    choose(entry, k => k === it.id, ok => judge(entry, ok, { reveal: answerLine(it), playId: s.from === "audio" ? null : it.id }));
  },
  pinyin(s, entry) {
    const it = byId[s.item];
    $("#card").innerHTML = `<span class="tag">say it in Pinyin</span><div class="big-en">${esc(it.english)}</div>
      <div class="prompt">Which one is it?</div>
      <div class="options${s.options.length === 3 ? " one" : ""}">${shuffle(s.options).map(o => `<button class="btn" data-k="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    choose(entry, k => k === it.pinyin, ok => judge(entry, ok, { reveal: answerLine(it), playId: it.id }));
  },
  match(s, entry) {
    // normal: Pinyin ↔ meaning. mode "sound": a sound ↔ its Pinyin
    const its = s.items.map(id => byId[id]), sound = s.mode === "sound";
    $("#card").innerHTML = `<span class="tag">match the pairs</span><div class="prompt">${sound ? "Tap a sound, then its Pinyin." : "Tap a Pinyin, then its meaning."}</div>
      <div class="match"><div class="col">${shuffle(its).map(i => `<button class="btn py-opt" data-side="l" data-id="${i.id}">${sound ? "🔊" : esc(i.pinyin)}</button>`).join("")}</div>
      <div class="col">${shuffle(its).map(i => `<button class="btn${sound ? " py-opt" : ""}" data-side="r" data-id="${i.id}">${esc(sound ? i.pinyin : i.english)}</button>`).join("")}</div></div>`;
    footerButton("Match all pairs", null, true);
    const sel = { l: null, r: null };
    let left = its.length, mistakes = 0;
    view.querySelectorAll(".match .btn").forEach(b => b.onclick = () => {
      if (b.disabled) return;
      const side = b.dataset.side;
      if (side === "l") play(b.dataset.id);
      if (sel[side]) sel[side].classList.remove("sel");
      sel[side] = b; b.classList.add("sel");
      if (!sel.l || !sel.r) return;
      const [l, r] = [sel.l, sel.r];
      sel.l = sel.r = null;
      l.classList.remove("sel"); r.classList.remove("sel");
      if (l.dataset.id === r.dataset.id) {
        l.disabled = r.disabled = true; l.classList.add("done"); r.classList.add("done");
        if (sound) l.textContent = byId[l.dataset.id].pinyin;
        entry.given = `${mistakes} wrong tap${mistakes === 1 ? "" : "s"}`;
        if (--left === 0) judge(entry, mistakes === 0, { requeue: false,
          title: mistakes ? `✓ Done, with ${mistakes} wrong tap${mistakes > 1 ? "s" : ""}` : "✓ All pairs right!" });
      } else {
        mistakes++;
        l.classList.add("wrong"); r.classList.add("wrong");
        setTimeout(() => { l.classList.remove("wrong"); r.classList.remove("wrong"); }, 600);
      }
    });
  },
  build(s, entry) {
    const it = byId[s.item];
    const answer = tilesOf(it.pinyin);
    const bank = shuffle([...answer, ...(s.extra || [])]);
    const chosen = [];
    $("#card").innerHTML = `<span class="tag">build the sentence</span><div class="big-en">${esc(it.english)}</div>
      <div class="answer" id="ans"></div><div class="bank" id="bank"></div>`;
    let done = false;
    const go = footerButton("Check", () => check(), true);
    const draw = () => {
      $("#ans").innerHTML = chosen.map((k, n) => `<button class="tile" data-n="${n}">${esc(bank[k])}</button>`).join("");
      $("#bank").innerHTML = bank.map((w, k) => `<button class="tile${chosen.includes(k) ? " used" : ""}" data-k="${k}">${esc(w)}</button>`).join("");
      $("#ans").querySelectorAll(".tile").forEach(t => t.onclick = () => { if (!done) { chosen.splice(+t.dataset.n, 1); draw(); } });
      $("#bank").querySelectorAll(".tile").forEach(t => t.onclick = () => {
        if (done || chosen.includes(+t.dataset.k)) return;
        chosen.push(+t.dataset.k);
        const wi = wordFor(bank[+t.dataset.k]);
        if (wi) play(wi.id);
        draw();
      });
      go.disabled = !chosen.length;
    };
    const check = () => {
      if (done || !chosen.length) return; done = true;
      const given = chosen.map(k => bank[k]);
      const ok = given.length === answer.length && given.every((w, n) => samePinyin(w, answer[n]));
      entry.given = given.join(" ");
      judge(entry, ok, { reveal: answerLine(it), playId: it.id });
    };
    draw();
    keyHandler = e => { if (e.key === "Enter") check(); else if (e.key === "Backspace" && chosen.length && !done) { chosen.pop(); draw(); } };
  },
  type(s, entry) {
    const it = byId[s.item];
    const front = s.from === "audio"
      ? `<span class="tag">listen and type</span><div class="prompt">Type what you hear.</div>${bigPlay(it.id)}`
      : `<span class="tag">type it</span><div class="big-en">${esc(it.english)}</div><div class="prompt">Type it in Pinyin.</div>`;
    if (s.from === "audio") entry.audio = it.id;
    $("#card").innerHTML = `${front}
      <input type="text" id="answer" placeholder="ma1  or  mā" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="muted small" style="margin-top:8px">Tone marks or tone numbers (1–4, 5 or nothing for neutral).</div>`;
    if (s.from === "audio") play(it.id);
    const input = $("#answer");
    let done = false;
    const go = footerButton("Check", () => check(), true);
    input.oninput = () => { go.disabled = !input.value.trim(); };
    const check = () => {
      if (done || !input.value.trim()) return; done = true;
      input.disabled = true;
      const v = checkAnswer(input.value, it);
      entry.given = input.value.trim();
      judge(entry, v === "ok", { title: v === "tones" ? "✗ Almost: the tones aren't right" : null,
                                 reveal: answerLine(it), playId: s.from === "audio" ? null : it.id });
    };
    input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); done ? nextStep() : check(); } });
    input.focus();
    keyHandler = e => { if (e.key === "p" && s.from === "audio") play(it.id); };
  },
  speak(s) {
    const it = byId[s.item];
    const canRecord = !!(navigator.mediaDevices && window.MediaRecorder);
    $("#card").innerHTML = `<span class="tag">say it aloud</span>${pinyinBlock(it)}<div class="en">${esc(it.english)}</div>
      <div class="row">${audioButtons(it.id)}</div>
      <div class="prompt" style="margin-top:16px">Listen, then say it out loud 2–3 times. Copy the tones.</div>
      ${canRecord ? `<div class="row rec"><button class="btn" id="rec">🎙 Record yourself</button>
        <button class="btn" id="mine" disabled>▶ You</button><button class="btn" id="both" disabled>▶ Original, then you</button></div>
        <div class="muted small" id="recmsg"></div>` : ""}`;
    play(it.id);
    continueFooter("I said it");
    const prev = keyHandler;
    keyHandler = e => { if (e.key === "p") play(it.id); else prev(e); };
    if (canRecord) recorder(it.id);
  },
};

// Record yourself and compare with the original (nothing leaves the browser)
let rec = null;
function recorder(id) {
  let url = null;
  const btn = $("#rec"), mine = $("#mine"), both = $("#both");
  const playUrl = () => new Promise(done => { stopAudio(); const a = new Audio(url); current = a; a.onended = done; a.onerror = done; a.play().catch(done); });
  btn.onclick = async () => {
    if (rec) { rec.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { $("#recmsg").textContent = "No microphone access. Just say it out loud instead."; return; }
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
      rec = null;
      if (!document.body.contains(btn)) return;
      btn.textContent = "🎙 Record again";
      mine.disabled = both.disabled = false;
      playUrl();
    };
    rec.start();
    btn.textContent = "■ Stop";
    setTimeout(() => { if (rec && rec.state === "recording") rec.stop(); }, 8000);
  };
  mine.onclick = () => playUrl();
  both.onclick = async () => {
    await new Promise(done => { stopAudio(); const a = audioFor(id); a.playbackRate = 1; a.currentTime = 0; current = a; a.onended = done; a.onerror = done; a.play().catch(done); });
    await new Promise(r => setTimeout(r, 300));
    playUrl();
  };
}

function finishLesson() {
  const { lesson } = L;
  const exercises = lesson.steps.filter(s => EXERCISES.has(s.type)).length;
  const accuracy = Math.round(100 * (exercises - L.wrong.size) / Math.max(1, exercises));
  const minutes = Math.max(1, Math.round((Date.now() - L.started) / 60000));
  const prev = state.lessons[lesson.id];
  state.lessons[lesson.id] = { done: prev ? prev.done : today(), last: today(), at: nowIso(),
                               best: Math.max(prev ? prev.best : 0, accuracy), times: (prev ? prev.times : 0) + 1 };
  delete state.removedLessons[lesson.id];
  markLessonDone(lesson.id);
  logEvent({ t: "lesson", lesson: lesson.id, score: accuracy, minutes, wrong: L.wrong.size, exercises });
  save(); updateStat();
  const next = DATA.lessons.find(l => !state.lessons[l.id]);
  L = null;
  keyHandler = null;
  view.innerHTML = `<div class="card center" style="margin-top:24px">
    <p style="font-size:2.4rem;margin:0">🎉</p><h3 style="margin:6px 0">Lesson complete!</h3>
    <div class="muted">${esc(lesson.id)}: ${esc(lesson.title)}</div>
    <div class="done-stats"><div><b>${accuracy}%</b><span class="small muted">right first time</span></div>
      <div><b>${minutes} min</b><span class="small muted">time</span></div>
      <div><b>${exercises}</b><span class="small muted">exercises</span></div></div>
    <p class="muted small">${prev ? "" : "Its sounds are now in <a href=\"#practice\" style=\"color:var(--accent)\">Practice</a>. "}
      <a href="${GITHUB}lessons/${lesson.file}" target="_blank" rel="noopener" style="color:var(--accent)">Lesson notes ↗</a></p>
    <div class="row"><button class="btn" data-copy-progress>📋 Copy progress for Claude</button></div><div data-copy-msg class="muted small"></div>
    <div class="row">${next ? `<a class="btn primary" href="#lesson/${next.id}">Next lesson</a>` : ""}
      <a class="btn${next ? "" : " primary"}" href="#learn">Back to lessons</a></div></div>`;
}

// ---------- Practice: an endless listening drill with the sounds of the lessons you've done ----------
// Each question is one of: which tone, which syllable (from ones with the same tone), same or different.
// A sound you get wrong comes back a few questions later. Every 10 answers go into the log for Claude.
const practice = { right: 0, total: 0, again: [], batch: { right: 0, total: 0 } };
const finalOf = base => base.replace(/^(zh|ch|sh|[bpmfdtnlgkhzcsrjqxwy])/, "");
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function flushPractice() {
  if (!practice.batch.total) return;
  logEvent({ t: "practice", ...practice.batch });
  practice.batch = { right: 0, total: 0 };
  save();
}
// other sounds in the same tone, the ones with the same final first (bō pō mō fō, not bō jī)
function neighbours(item, pool) {
  const [base, tone] = item.syllables[0];
  const others = shuffle(pool.filter(i => i.syllables[0][1] === tone && i.syllables[0][0] !== base));
  return [...others.filter(i => finalOf(i.syllables[0][0]) === finalOf(base)),
          ...others.filter(i => finalOf(i.syllables[0][0]) !== finalOf(base))];
}
function renderPractice() {
  keyHandler = null;
  const pool = unlockedItems().filter(i => i.kind === "sound" && i.syllables[0][1] !== 5);
  if (pool.length < 4) {
    view.innerHTML = `<div class="card center"><p><b>Nothing to practise yet.</b></p>
      <p class="muted">Finish a lesson in <a href="#learn">Learn</a>. Its sounds then come back here in a mixed listening drill:
      which tone, which sound, same or different.</p></div>`;
    return;
  }
  const back = practice.again.findIndex(a => a.at <= practice.total);
  const item = back >= 0 ? byId[practice.again.splice(back, 1)[0].id] : pickOne(pool);
  const [base, tone] = item.syllables[0];
  const near = neighbours(item, pool);
  const r = Math.random();
  const kind = r < 0.4 || !near.length ? "tone" : r < 0.75 ? "hear" : "same";
  let other = item, prompt, options, isRight, playIds;
  if (kind === "tone") {
    prompt = "Which tone is it?";
    options = [1, 2, 3, 4].map(t => [String(t), `${toneSvg(t, 44)}<span>${TONE_NAME[t]}</span>`]);
    isRight = k => +k === tone;
    playIds = [item.id];
  } else if (kind === "hear") {
    prompt = "What do you hear?";
    options = shuffle([item, ...near.slice(0, 3)]).map(i => [i.id, esc(i.pinyin)]);
    isRight = k => k === item.id;
    playIds = [item.id];
  } else {
    // half the time the same sound twice; otherwise another tone, or another syllable in the same tone
    const tones = pool.filter(i => i.syllables[0][0] === base && i.id !== item.id);
    other = Math.random() < 0.5 ? item : Math.random() < 0.5 && tones.length ? pickOne(tones) : near[0];
    prompt = "Two sounds. Are they the same?";
    options = [["same", "Same"], ["diff", "Different"]];
    isRight = k => (k === "same") === (other === item);
    playIds = shuffle([item.id, other.id]);
  }
  view.innerHTML = `<div class="card center">
    <span class="tag">${kind === "same" ? "same or different" : "listen"}</span> <span class="tag" id="score">${practice.right} / ${practice.total}</span>
    <div class="prompt">${prompt}</div>
    <div class="row"><button class="btn bigplay" data-seq="${playIds.join(" ")}" title="Play again">${playIds.map(() => "🔊").join(" ")}</button>
      ${playIds.length === 1 ? `<button class="btn icon" data-slow="${item.id}" title="Play slowly">🐢</button>` : ""}</div>
    <div class="options">${options.map(([k, html]) => `<button class="btn${kind === "tone" ? " tonebtn" : ""}" data-k="${k}">${html}</button>`).join("")}</div>
    <div id="back"></div></div>`;
  playSeq(playIds);
  const btns = [...view.querySelectorAll("[data-k]")];
  let answered = false;
  const answer = b => {
    if (answered) return; answered = true;
    const ok = isRight(b.dataset.k);
    btns.forEach(x => { x.disabled = true; if (isRight(x.dataset.k)) x.classList.add("right"); });
    if (!ok) {
      b.classList.add("wrong");
      practice.again.push({ id: item.id, at: practice.total + 4 });
      const pair = playIds.map(id => byId[id].pinyin).join(" / ");
      logEvent(kind === "tone" ? { t: "mistake", lesson: "practice", type: "tone", want: item.pinyin, got: TONE_NAME[b.dataset.k] }
             : kind === "hear" ? { t: "mistake", lesson: "practice", type: "hear", want: item.pinyin, got: byId[b.dataset.k].pinyin }
             : { t: "mistake", lesson: "practice", type: "same", want: `${pair} (${other === item ? "same" : "different"})`,
                 got: b.dataset.k === "same" ? "said same" : "said different" });
    }
    practice.total++; practice.batch.total++;
    if (ok) { practice.right++; practice.batch.right++; }
    if (practice.batch.total >= 10) flushPractice(); else save();
    $("#score").textContent = `${practice.right} / ${practice.total}`;
    $("#back").innerHTML = `<div class="result ${ok ? "ok" : "no"}">${ok ? "✓ Right" : "✗ Not this time"}</div>
      <div class="fbans" style="justify-content:center">${[...new Set(playIds)].map(id =>
        `<b>${esc(byId[id].pinyin)}</b><button class="btn icon" data-play="${id}" title="Play">🔊</button>`).join("")}</div>
      <div class="row"><button class="btn primary" id="next">Next</button></div>`;
    $("#next").onclick = renderPractice;
    $("#next").focus();
  };
  btns.forEach(b => b.onclick = () => answer(b));
  keyHandler = e => {
    const n = +e.key;
    if (e.key === "p") playSeq(playIds);
    else if (!answered && n >= 1 && n <= btns.length) answer(btns[n - 1]);
    else if (answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); renderPractice(); }
  };
}

// ---------- Listen (all audio of a lesson) ----------
function renderListen(lessonId) {
  keyHandler = null;
  const lesson = DATA.lessons.find(l => l.id === lessonId) || DATA.lessons[0];
  const items = DATA.items.filter(i => i.lesson === lesson.id);
  const group = (kind, title) => {
    const list = items.filter(i => i.kind === kind);
    return list.length ? `<h2>${title}</h2>${itemList(list)}` : "";
  };
  const sounds = {};
  for (const i of items.filter(i => i.kind === "sound")) (sounds[i.syllables[0][0]] ||= []).push(i.id);
  const soundHtml = Object.keys(sounds).length ? `<h2>Sounds in every tone</h2><div class="card" style="padding:12px 8px">${
    Object.values(sounds).map(ids => sylRow(ids.sort())).join("")}</div>` : "";
  view.innerHTML = `<div class="list">${DATA.lessons.length > 1 ? `<div class="row" style="margin:0">${
      DATA.lessons.map(l => `<a class="btn${l.id === lesson.id ? " primary" : ""}" href="#listen/${l.id}">${esc(l.id)}</a>`).join("")}</div>` : ""}
    <div class="card"><div class="t"><b>${esc(lesson.id)}: ${esc(lesson.title)}</b></div>
      <a class="small" style="color:var(--accent)" href="${GITHUB}lessons/${lesson.file}" target="_blank" rel="noopener">Lesson notes ↗</a></div>
    </div>${group("word", "Words")}${group("phrase", "Phrases")}${soundHtml}`;
}

// ---------- Settings ----------
function renderSettings() {
  keyHandler = null;
  view.innerHTML = `<h2 style="margin-top:0">Lessons done</h2>
    <p class="muted small" style="margin-top:0">Lessons you finish are ticked automatically. Ticking one by hand also adds its sounds to Practice.</p>
    <div class="list">${DATA.lessons.map(l => `<label class="lesson"><input type="checkbox" data-lesson="${l.id}" ${state.lessons[l.id] ? "checked" : ""}>
        <div class="main"><div class="t">${esc(l.id)}: ${esc(l.title)}</div></div>
        <a href="${GITHUB}lessons/${l.file}" target="_blank" rel="noopener">notes ↗</a></label>`).join("")}</div>
    <h2>Settings</h2>
    <div class="card">
      <div class="setting"><span>Show tone numbers under Pinyin</span><input type="checkbox" id="numbers" ${state.settings.numbers ? "checked" : ""}></div>
    </div>
    <h2>Sync between devices</h2>
    <div class="card">${syncCfg.token ? `
      <p style="margin-top:0">This ${esc(syncCfg.device || "device")} syncs with <b>${esc(syncCfg.repo)}</b> (branch <code>${SYNC_BRANCH}</code>): lessons, practice and mistakes.</p>
      <p class="muted small" data-sync-status>${syncStatus()}</p>
      <div class="row" style="justify-content:flex-start;margin-top:0">
        <button class="btn primary" id="syncNow">Sync now</button><button class="btn" id="syncOff">Disconnect</button></div>` : `
      <p class="muted small" style="margin-top:0">Keeps your phone and computer in step through a file in your GitHub repo, and Claude can read it there. You need a GitHub token: <a href="${GITHUB}README.md#sync-between-devices" target="_blank" rel="noopener" style="color:var(--accent)">how to make one ↗</a></p>
      <div class="sync-form">
        <label class="small">GitHub token<input type="password" id="syncToken" placeholder="github_pat_…" autocomplete="off"></label>
        <label class="small">Repository<input type="text" id="syncRepo" value="FlorianPein/chinese" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <label class="small">Name of this device<input type="text" id="syncDevice" value="${/Mobi|Android|iPhone|iPad/.test(navigator.userAgent) ? "phone" : "computer"}" autocomplete="off"></label>
      </div>
      <div class="row" style="justify-content:flex-start;margin-top:0"><button class="btn primary" id="syncOn">Connect</button></div>
      <p class="muted small" data-sync-status>${syncCfg.error ? syncStatus() : ""}</p>`}
    </div>
    <h2>Your progress</h2>
    <div class="card">
      <p class="muted small" style="margin-top:0"><b>For Claude:</b> copy your progress and paste it into a chat with Claude. It's a short summary (lessons, mistakes, practice) that Claude uses to adapt the next lessons.</p>
      <div class="row" style="justify-content:flex-start;margin-top:0"><button class="btn primary" data-copy-progress>📋 Copy progress for Claude</button></div>
      <div data-copy-msg class="muted small"></div>
      <hr>
      <p class="muted small" style="margin-top:0">Progress is saved in this browser${syncCfg.token ? " and synced" : ". To keep devices in step, use sync above"}. Export saves it to a file; Import <b>replaces</b> this browser's progress with one.</p>
      <div class="row" style="justify-content:flex-start">
        <button class="btn" id="export">Export</button>
        <label class="btn">Import<input type="file" id="import" accept="application/json" hidden></label>
        <button class="btn" id="reset">Reset</button>
      </div>
    </div>`;
  view.querySelectorAll("[data-lesson]").forEach(cb => cb.onchange = () => {
    const id = cb.dataset.lesson;
    if (cb.checked) {
      state.lessons[id] = state.lessons[id] || { done: today(), last: today(), at: nowIso(), best: 0, times: 0 };
      delete state.removedLessons[id];
      markLessonDone(id);
    } else {
      delete state.lessons[id];
      state.removedLessons[id] = nowIso();
      state.unlocked = state.unlocked.filter(x => x !== id);
    }
    save(); updateStat();
  });
  $("#numbers").onchange = e => { state.settings.numbers = e.target.checked; save(); };
  $("#export").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: "application/json" }));
    a.download = `pinyin-progress-${today()}.json`;
    a.click();
  };
  $("#import").onchange = async e => {
    try {
      const s = JSON.parse(await e.target.files[0].text());
      if (!s.lessons || !s.unlocked) throw new Error();
      state = { ...structuredClone(DEFAULT_STATE), ...s }; save(); updateStat(); renderSettings();
      alert("Progress imported.");
    } catch { alert("That file doesn't look like an exported progress file."); }
  };
  if ($("#syncOn")) $("#syncOn").onclick = async () => {
    const token = $("#syncToken").value.trim(), repo = $("#syncRepo").value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, "");
    if (!token || !/^[\w.-]+\/[\w.-]+$/.test(repo)) { $("[data-sync-status]").textContent = "Fill in the token and the repository (owner/name)."; return; }
    syncCfg = { token, repo, device: $("#syncDevice").value.trim() || "device" };
    $("[data-sync-status]").textContent = "Connecting…";
    await syncNow();
    if (syncCfg.error && !syncCfg.last) { const error = syncCfg.error; syncCfg = { error }; }   // never worked: forget the token
    saveSyncCfg(); renderSettings();
  };
  if ($("#syncNow")) $("#syncNow").onclick = () => { $("[data-sync-status]").textContent = "Syncing…"; syncNow(); };
  if ($("#syncOff")) $("#syncOff").onclick = () => {
    if (confirm("Stop syncing on this device? Your progress stays here and on GitHub.")) { syncCfg = {}; saveSyncCfg(); renderSettings(); }
  };
  $("#reset").onclick = () => {
    if (confirm(syncCfg.token ? "Delete all progress in this browser? Sync is on, so it comes back from GitHub at the next sync. Disconnect first to start from zero here."
                              : "Delete all progress in this browser?")) { state = structuredClone(DEFAULT_STATE); save(); updateStat(); renderSettings(); }
  };
}

// ---------- routing ----------
function route() {
  let [tab, arg] = (location.hash.slice(1) || "learn").split("/");
  if (["review", "words", "tones"].includes(tab)) tab = "practice";   // tabs of an earlier version
  stopAudio();
  if (tab !== "practice") flushPractice();
  if (tab !== "lesson") L = null;
  document.body.classList.toggle("inlesson", tab === "lesson");
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  ({ learn: renderLearn, practice: renderPractice, listen: () => renderListen(arg),
     settings: renderSettings, lesson: () => startLesson(arg) }[tab] || renderLearn)();
  updateStat();
}

// no-cache: always check for a newer course, so a rebuilt course shows up straight away
fetch("cards.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(d => {
    DATA = d;
    for (const i of d.items) byId[i.id] = i;
    // drop progress for lessons that no longer exist (e.g. after the course was restructured)
    const ids = new Set(d.lessons.map(l => l.id));
    state.unlocked = state.unlocked.filter(id => ids.has(id));
    window.addEventListener("hashchange", route);
    route();
    syncNow();
  })
  .catch(() => { view.innerHTML = `<div class="card center muted">Couldn't load the lessons. If you opened this file directly, run a local server: <code>python3 -m http.server -d docs</code></div>`; });
</script>
</body>
</html>
