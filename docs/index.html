<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinyin Lessons</title>
<meta name="theme-color" content="#b23a2e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>">
<style>
:root {
  --bg: #faf7f2; --surface: #ffffff; --surface-2: #f2ede4; --text: #1f1b16; --muted: #6b6258;
  --border: #e3dccf; --accent: #b23a2e; --accent-text: #ffffff; --good: #2f7d4f; --bad: #b23a2e;
  --warn: #9a6b00; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171411; --surface: #221e1a; --surface-2: #2c2722; --text: #f1ebe3; --muted: #a59a8d;
    --border: #3a332c; --accent: #e0675a; --accent-text: #1a0f0d; --good: #5cc28a; --bad: #e0675a;
    --warn: #e0b04f; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #171411; --surface: #221e1a; --surface-2: #2c2722; --text: #f1ebe3; --muted: #a59a8d;
  --border: #3a332c; --accent: #e0675a; --accent-text: #1a0f0d; --good: #5cc28a; --bad: #e0675a;
  --warn: #e0b04f; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 0 8px; gap: 12px; }
header h1 { font-size: 1.15rem; margin: 0; letter-spacing: .01em; }
header .stat { color: var(--muted); font-size: .9rem; white-space: nowrap; }
nav { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin: 8px 0 20px; }
nav a {
  flex: 1; text-align: center; padding: 8px 2px; border-radius: 9px; text-decoration: none;
  color: var(--muted); font-size: .95rem; font-weight: 500;
}
nav a.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
body.inlesson header, body.inlesson nav { display: none; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 24px 20px; box-shadow: var(--shadow);
}
.center { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tag {
  display: inline-block; font-size: .75rem; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); background: var(--surface-2); padding: 2px 8px; border-radius: 99px;
}
.py { font-size: 2rem; line-height: 1.25; font-weight: 600; margin: 14px 0 2px; overflow-wrap: anywhere; }
.num { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.en { font-size: 1.3rem; margin: 14px 0 0; }
.lit { color: var(--muted); font-style: italic; margin-top: 4px; }
.note { margin-top: 12px; font-size: .9rem; color: var(--warn); }
.prompt { font-size: 1.05rem; color: var(--muted); margin-top: 6px; }
.big-en { font-size: 1.6rem; font-weight: 600; margin: 14px 0 4px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.btn {
  border: 1px solid var(--border); background: var(--surface-2); padding: 10px 16px; border-radius: 10px;
  cursor: pointer; min-height: 44px;
}
.btn:hover { filter: brightness(.97); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.icon { padding: 10px 14px; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.bigplay { font-size: 1.8rem; padding: 14px 26px; border-radius: 16px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.grades .btn { padding: 10px 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.grades .btn small { color: var(--muted); font-size: .72rem; margin-top: 2px; }
.grades .btn.primary small { color: inherit; opacity: .85; }
a.btn { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
a.btn.primary { color: var(--accent-text); }
.grades .again { border-color: var(--bad); }
.grades .good { border-color: var(--good); }
input[type=text] {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); font-size: 1.2rem; margin-top: 16px; text-align: center;
}
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.result { margin-top: 14px; font-weight: 600; }
.result.ok { color: var(--good); }
.result.no { color: var(--bad); }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.options.one { grid-template-columns: 1fr; }
.options.three { grid-template-columns: repeat(3, 1fr); }
.options .btn.playing { outline: 2px solid var(--accent); }
.options .btn { font-size: 1.35rem; padding: 14px 8px; }
.options.text .btn { font-size: 1.05rem; }
.btn.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 15%, var(--surface)); }
.btn.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, var(--surface)); }
.btn.right:disabled, .btn.wrong:disabled { opacity: 1; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item {
  display: flex; gap: 12px; align-items: flex-start; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
}
.item .main { flex: 1; min-width: 0; }
.item .p { font-weight: 600; font-size: 1.15rem; }
.item .e { color: var(--text); }
.item .l { color: var(--muted); font-size: .85rem; font-style: italic; }
.item .btns { display: flex; gap: 6px; }
.item .btn { min-height: 40px; padding: 6px 10px; }
.lesson {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
}
.lesson input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.lesson .main { flex: 1; min-width: 0; }
.lesson .t { font-weight: 600; }
.lesson a { color: var(--accent); font-size: .9rem; white-space: nowrap; }
h2 { font-size: 1rem; margin: 26px 0 10px; color: var(--muted); font-weight: 600; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.sync-form input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; margin: 4px 0 10px; }
.sync-form label { display: block; }
.setting input[type=number] {
  width: 72px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
}
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: -8px 0 16px; }
.progress > div { height: 100%; background: var(--accent); transition: width .3s; }
.kbd { font-size: .75rem; color: var(--muted); margin-top: 14px; }

/* learn path */
.topic h2 { margin-bottom: 2px; color: var(--text); }
.lrow {
  display: flex; align-items: center; gap: 12px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; text-decoration: none;
}
.lrow.next { border-color: var(--accent); box-shadow: var(--shadow); }
.lrow .ic {
  flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); font-weight: 700; color: var(--muted);
}
.lrow.done .ic { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.lrow.next .ic { background: var(--accent); color: var(--accent-text); }
.lrow .main { flex: 1; min-width: 0; }
.lrow .t { font-weight: 600; }
.lrow .go { color: var(--accent); font-weight: 600; font-size: .9rem; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }

/* lesson player */
.ltop { display: flex; align-items: center; gap: 8px; padding: 14px 0 12px; }
.ltop .progress { flex: 1; margin: 0; height: 10px; }
.ltop .btn { min-height: 40px; padding: 6px 10px; font-size: 1.1rem; color: var(--muted); }
.step { text-align: center; min-height: 300px; }
.step h3 { font-size: 1.3rem; margin: 10px 0 6px; }
.step .text { text-align: left; margin: 10px auto 0; max-width: 34em; }
.step .text p { margin: 0 0 10px; }
.step .sub { color: var(--muted); font-size: .9rem; margin-top: 18px; }
.tonebig { display: flex; justify-content: center; margin-top: 6px; color: var(--accent); }
.sylrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; align-items: stretch; }
.syl {
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px;
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px; padding: 8px 10px; cursor: pointer;
}
.syl svg { color: var(--muted); }
.syl .sp { font-size: 1.3rem; font-weight: 600; line-height: 1.2; }
.syl .sl { font-size: .72rem; color: var(--muted); max-width: 7em; line-height: 1.2; }
.syl.on { border-color: var(--accent); }
.syl.on svg { color: var(--accent); }
.syl.playing { outline: 2px solid var(--accent); }
.tonebtn { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tonebtn svg { color: var(--accent); }
.tonebtn span { font-size: .95rem; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.chip {
  display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border);
  background: var(--surface-2); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: 1.1rem; font-weight: 600;
}
.chip small { font-weight: 400; font-size: .75rem; color: var(--muted); }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.match .btn { min-height: 52px; padding: 8px; }
.match .btn.py-opt { font-size: 1.2rem; font-weight: 600; }
.match .btn.sel { border-color: var(--accent); outline: 2px solid var(--accent); }
.match .btn.done { opacity: .35; }
.answer {
  min-height: 58px; border-bottom: 2px solid var(--border); margin: 18px 0 14px; padding: 6px 0;
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center;
}
.bank { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tile {
  border: 1px solid var(--border); background: var(--surface); border-bottom-width: 3px; border-radius: 10px;
  padding: 8px 14px; font-size: 1.2rem; font-weight: 600; cursor: pointer; min-height: 44px;
}
.tile.used { visibility: hidden; }
.footer { position: sticky; bottom: 0; padding: 14px 0 16px; margin-top: 14px; background: var(--bg); }
.footer.ok, .footer.no { border-radius: 16px; padding: 14px 16px 16px; }
.footer.ok { background: color-mix(in srgb, var(--good) 14%, var(--bg)); }
.footer.no { background: color-mix(in srgb, var(--bad) 14%, var(--bg)); }
.fbhead { font-weight: 700; font-size: 1.1rem; }
.footer.ok .fbhead { color: var(--good); }
.footer.no .fbhead { color: var(--bad); }
.fbans { margin: 4px 0 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.fbans b { font-size: 1.2rem; }
.fbans .btn { min-height: 36px; padding: 4px 10px; }
.rec { margin-top: 18px; }
.btn.sel { border-color: var(--accent); outline: 2px solid var(--accent); }
.lrow.planned { opacity: .6; padding: 8px 14px; }
.lrow.planned .ic { width: 28px; height: 28px; font-size: .85rem; }
details.later { margin-top: 26px; }
details.later summary { cursor: pointer; color: var(--muted); font-weight: 600; }
details.later .list { margin-top: 10px; }
.chart { display: grid; gap: 6px; margin: 16px auto 0; max-width: 420px; align-items: stretch; }
.chart button {
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; cursor: pointer;
  min-height: 48px; padding: 6px 8px;
}
.chart .chead { display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border-color: transparent; color: var(--muted); font-size: .75rem; }
.chart .chead svg { color: var(--accent); }
.chart .rhead { font-weight: 600; background: transparent; text-align: left; }
.chart .ccell { font-size: 1.25rem; font-weight: 600; }
.chart .playing { outline: 2px solid var(--accent); }
.done-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.done-stats div { background: var(--surface-2); border-radius: 12px; padding: 12px 6px; }
.done-stats b { display: block; font-size: 1.4rem; }
/* words */
.scard .spy { font-size: 1.45rem; line-height: 1.35; font-weight: 600; margin-top: 12px; overflow-wrap: anywhere; }
.scard .shz { font-size: 1.9rem; line-height: 1.35; margin-top: 6px; }
.scard .big-en { font-size: 1.4rem; line-height: 1.35; }
.swords .chip { gap: 1px; font-size: 1rem; padding: 5px 10px; color: var(--text); }
.swords .chip .hzf { font-size: 1.25rem; }
.newkey { border: 1px solid var(--accent); border-radius: 6px; padding: 0 5px; font-size: .75rem; color: var(--accent); }
.sfwords { display: flex; flex-direction: column; margin: 14px auto 0; max-width: 28rem; text-align: left; }
.sfw { display: grid; grid-template-columns: auto auto 1fr auto; gap: 0 10px; align-items: center; padding: 5px 8px; border-top: 1px solid var(--border); }
.sfw:first-child { border-top: 0; }
.sfw .hzf { font-size: 1.25rem; white-space: nowrap; }
.sfw b { font-weight: 600; white-space: nowrap; }
.sfw .g { font-size: .88rem; color: var(--muted); line-height: 1.3; min-width: 0; }
.sfw .btn { min-height: 34px; padding: 2px 8px; }
.sfw.new { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-radius: 8px; border-top-color: transparent; }
.sfw.new + .sfw { border-top-color: transparent; }
.sfw.new .g { color: var(--text); }
.sfstudy .item { align-items: flex-start; }
.sfstudy .item .p { font-size: 1.05rem; }
.sfstudy .hzl { font-size: 1.35rem; line-height: 1.4; }
.sfstudy .why { margin-left: 8px; color: var(--bad); }
.sfstudy .sfwords { margin: 8px 0 0; }
.swords .chip.weak .hzf { text-decoration: underline; text-decoration-color: var(--warn); text-underline-offset: 4px; }
.grades.three { grid-template-columns: repeat(3, 1fr); }
.sgroups { display: grid; gap: 8px; margin-bottom: 4px; }
.sgroups .btn { display: flex; justify-content: space-between; align-items: center; text-align: left; }
.sgroups .btn b { font-size: 1.1rem; }
.sgroups .btn small { display: block; font-size: .78rem; font-weight: 400; opacity: .8; margin-top: 2px; }
.grades.three .btn { min-height: 52px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 12px; }
.seg .btn { font-size: .9rem; padding: 8px 6px; }
.seg .btn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); font-weight: 600; }
.wcard { cursor: pointer; min-height: 260px; }
.wcard .py { margin-top: 10px; }
.wcard .hz { font-size: 2.6rem; line-height: 1.3; margin-top: 8px; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
.wcard .parts { margin-top: 12px; }
.wcard .parts .chip { flex-direction: row; gap: 6px; font-size: 1rem; padding: 5px 10px; color: var(--text); }
.wcard .parts .chip .hzf { font-size: 1.2rem; }
.wcard .parts .chip small { font-size: .8rem; }
.wex-top { display: flex; gap: 10px; align-items: flex-start; }
.wex-top > div { flex: 1; min-width: 0; }
.wex .btns { display: flex; flex-direction: column; gap: 4px; flex: none; }
.wex .btns .btn { padding: 6px 10px; }
.wex { margin: 14px auto 4px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 8px; text-align: left; max-width: 26rem; }
.wex-py { font-size: 1.05rem; }
.wex-hz { font-size: 1.35rem; margin-top: 2px; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
.wex-en { color: var(--muted); margin-top: 4px; }
.wex b { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.grades.five { grid-template-columns: repeat(5, 1fr); gap: 6px; }
.grades.five .btn { font-size: .82rem; padding: 8px 2px; min-height: 58px; }
.grades .btn.g1 { border-color: var(--bad); }
.grades .btn.g2 { border-color: var(--warn); }
.grades .btn.g4, .grades .btn.g5 { border-color: var(--good); }
.wtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 0 12px; }
.wtop .btn { min-height: 40px; padding: 6px 12px; }
.hardlist .item .p { font-size: 1.05rem; }
.hardlist .item .hz { font-size: 1.3rem; margin-right: 6px; }
table.study { width: 100%; border-collapse: collapse; margin: 4px 0 14px; }
table.study th { text-align: left; font-size: .8rem; font-weight: 600; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--border); }
table.study td { padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.study .hz { font-size: 1.35rem; white-space: nowrap; }
table.study .py { font-size: 1.05rem; white-space: nowrap; }
table.study .why { display: block; font-size: .75rem; color: var(--muted); }
table.study .why.dk { color: var(--bad); }
table.study td.pl { width: 1%; }
table.study td.pl .btn { min-height: 36px; padding: 4px 9px; }
/* grammar */
.hzf { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
.gsession h2.gtitle { font-size: 1.45rem; color: var(--text); margin: 10px 0 4px; }
.gsession .ggoal { color: var(--muted); margin: 0 0 6px; }
.gsession h3 { font-size: 1.1rem; margin: 26px 0 6px; }
.gsession p { margin: 8px 0; }
.gpat { margin: 14px 0; padding: 12px 14px; border: 1px dashed var(--accent); border-radius: 12px; text-align: center; }
.gpat-f { font-size: 1.2rem; font-weight: 600; }
.gpat-f .hzf { color: var(--accent); }
.gpat-en { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.gex { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; border-left: 3px solid var(--accent); }
.gex .btns { display: flex; flex-direction: column; gap: 4px; flex: none; }
.gex .btn { min-height: 38px; padding: 4px 9px; }
.gex .main { flex: 1; min-width: 0; }
.gex-py { font-size: 1.08rem; overflow-wrap: anywhere; }
.gex-hz { font-size: 1.35rem; line-height: 1.4; }
.gex-en { color: var(--muted); }
.gex-note { color: var(--warn); font-size: .88rem; margin-top: 4px; }
.gex b { font-weight: 700; color: var(--accent); }
.gex.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, var(--surface)); }
.gex.bad .gx { flex: none; width: 30px; text-align: center; color: var(--bad); font-weight: 700; font-size: 1.2rem; }
.gex.bad .gex-py, .gex.bad .gex-hz { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 60%, transparent); }
.gex.bad .gex-why { margin-top: 4px; }
.gtip { margin: 16px 0 6px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 12%, var(--surface)); font-size: .95rem; }
.gtip p { margin: 0; }
details.gwords { margin: 10px 0 4px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
details.gwords summary { cursor: pointer; font-weight: 600; font-size: .95rem; }
.gwlist { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.gw { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 2px 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--border); }
.gw .w { display: flex; flex-direction: column; line-height: 1.25; }
.gw .w .hzf { font-size: 1.2rem; }
.gw .w .p { font-weight: 600; font-size: .9rem; }
.gw .e { font-size: .9rem; min-width: 0; line-height: 1.3; }
.gw .s { display: block; font-size: .75rem; color: var(--muted); }
.gw .s.ok { color: var(--good); }
.gw .s.new { color: var(--accent); }
.gw .btn { min-height: 34px; padding: 2px 8px; }
.gq-sent { margin: 14px 0 4px; }
.gq-sent .py { font-size: 1.35rem; font-weight: 600; margin: 0; }
.gq-sent .hzf { font-size: 1.6rem; margin-top: 2px; }

<script>

const KEY = "pinyin-flashcards-v1";
// cards: word flashcards from an earlier version of the course, kept so older copies of the app still sync
// words: progress of each word flashcard, by its characters (see srs.js)
// grammar: grammar sessions checked, by topic id ({done, last, best, times, at})

// spoonfed: progress of each Spoonfed sentence flashcard, by its id (same fields as words)
const DEFAULT_STATE = { unlocked: [], cards: {}, words: {}, sentences: {}, spoonfed: {}, grammar: {}, lessons: {}, removedLessons: {}, log: [], settings: { numbers: true, autoplay: true } };

function mergeState(a, b) {

    if (!o || ta > tb || (ta === tb && na > nb)) cards[id] = c;

    const out = { ...(b[key] || {}) };
    for (const [w, c] of Object.entries(a[key] || {})) {
      const o = out[w];

    }

    if (!o || (c.at || "") > (o.at || "") || (c.at === o.at && c.n > o.n)) sentences[id] = c;

  for (const id of new Set([...Object.keys(ga), ...Object.keys(gb)])) {
    const x = ga[id], y = gb[id];
    grammar[id] = x && y ? { done: x.done < y.done ? x.done : y.done, last: x.last > y.last ? x.last : y.last,

async function gh(path, opts = {}) {

    cache: "no-store", ...opts,
    headers: { Authorization: `Bearer ${syncCfg.token}`, Accept: "application/vnd.github+json",

    const tree = await gh("git/trees", { method: "POST", body: JSON.stringify({ tree: [{ path: SYNC_FILE, mode: "100644", type: "blob", content }] }) });

  if (e.status === 403 || e.status === 404) return `The token can't write to ${syncCfg.repo}. Check that it has access to this repository, with Contents: Read and write.`;

    for (let attempt = 0; ; attempt++) {

// ---------- Copy progress for Claude ----------
// A readable summary plus the exact new log entries since the last copy, as JSON.
function progressReport() {
  const now = new Date().toISOString().slice(0, 16).replace("T", " ");
  const since = state.copiedAt || "";
  flushSentences();
  const fresh = state.log.filter(e => e.d > since);
  const lines = [`## Pinyin progress (copied ${now} UTC${since ? `, new since ${since.replace("T", " ")}` : ""})`, ""];

  const done = DATA.lessons.filter(l => state.lessons[l.id]);
  lines.push(`**Lessons done:** ${done.length ? done.map(l => {
    const st = state.lessons[l.id];
    return `${l.id} (${st.done}, best ${st.best}%, ${st.times}×)`;
  }).join(", ") : "none yet"}`);

  const runs = fresh.filter(e => e.t === "lesson");
  if (runs.length) lines.push(`**Lessons since last copy:** ${runs.map(e => `${e.lesson} ${e.score}% in ${e.minutes} min`).join(", ")}`);

  const misses = state.log.filter(e => e.t === "mistake");
  if (misses.length) {
    const count = {};
    for (const e of misses) { const k = `${e.type}: ${e.want} → ${e.got}`; count[k] = (count[k] || 0) + 1; }
    const top = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 12);
    lines.push("", `**Most frequent mistakes** (all time, ${misses.length} in total):`);
    top.forEach(([k, n]) => lines.push(`- ${n}× ${k}`));
  }

  const rounds = state.log.filter(e => e.t === "practice");
  if (rounds.length) {
    const week = new Date(Date.now() - 7 * DAY).toISOString().slice(0, 16);
    const sum = list => list.reduce((a, e) => [a[0] + e.right, a[1] + e.total], [0, 0]);
    const [r, n] = sum(rounds), [rw, nw] = sum(rounds.filter(e => e.d > week));
    lines.push("", `**Exercises, all lessons mixed:** ${n} questions in total (${Math.round(100 * r / n)}% right), ${nw} in the last 7 days${nw ? ` (${Math.round(100 * rw / nw)}% right)` : ""}.`);
  }

  flushWords();
  const seen = Object.entries(state.words);
  const words = { seen: seen.length, forgotten: {} };
  if (seen.length) {
    const show = h => W.byHanzi[h] ? `${h} ${W.byHanzi[h].pinyin}` : h;
    const n = W.list.length ? SRS.counts(W.list, state.words, Date.now()) : null;
    if (n) Object.assign(words, { of: W.list.length, due: n.due, parked: n.parked });
    lines.push("", `**Words:** ${seen.length} seen${n ? ` of ${W.list.length}, ${n.due} due now${n.parked ? `, ${n.parked} set aside until studied (Don't know twice)` : ""}` : ""}.`);
    const batches = fresh.filter(e => e.t === "words" && !e.practice);
    const practised = fresh.filter(e => e.t === "words" && e.practice).reduce((a, e) => a + e.total, 0);
    if (batches.length) {
      const g = [0, 0, 0, 0, 0];
      batches.forEach(e => e.grades.forEach((x, i) => g[i] += x));
      lines.push(`Since last copy: ${g.reduce((a, b) => a + b)} answers (${SRS.GRADES.map((x, i) => `${x} ${g[i]}`).join(", ")}), ${batches.reduce((a, e) => a + e.new, 0)} new words.`);
    }
    if (practised) lines.push(`Practice of the day's Know words: ${practised} answers.`);
    const often = seen.filter(([, c]) => c.lapses >= 2).sort((a, b) => b[1].lapses - a[1].lapses);
    often.forEach(([h, c]) => words.forgotten[h] = c.lapses);
    if (often.length) lines.push(`**Words often forgotten** (⚑ = hard word): ${often.slice(0, 20).map(([h, c]) =>
      `${show(h)} ${c.lapses}×${c.lapses >= SRS.HARD ? " ⚑" : ""}`).join(", ")}`);
  }

  const sdone = Object.values(state.sentences);
  const sentences = { done: sdone.length, ok: sdone.filter(c => c.last === 3).length };
  if (sdone.length) {
    lines.push("", `**Sentences:** ${sdone.length} translated, ${sentences.ok} got right the last time${S.list.length ? ` (${S.list.filter(sentenceReady).length} of ${S.list.length} ready)` : ""}.`);
    const rs = fresh.filter(e => e.t === "sentences");
    if (rs.length) {
      const g = [0, 0, 0];
      rs.forEach(e => e.grades.forEach((x, i) => g[i] += x));
      lines.push(`Since last copy: ${g.reduce((a, b) => a + b)} answers (${S_GRADES.map((x, i) => `${x} ${g[i]}`).join(", ")}).`);
      const wrong = [...new Set(rs.flatMap(e => e.wrong || []))];
      if (wrong.length) lines.push(`Sentences not (fully) got: ${wrong.slice(0, 20).join(" · ")}`);
    }
  }

  flushSpoonfed();
  const fseen = Object.entries(state.spoonfed);
  const spoonfed = { seen: fseen.length, forgotten: {} };
  if (fseen.length) {
    const n = F.list.length ? SRS.counts(F.list, state.spoonfed, Date.now()) : null;
    if (n) Object.assign(spoonfed, { of: F.list.length, due: n.due, parked: n.parked,
                                     next: (F.list.findIndex(id => !state.spoonfed[id]) + 1) || F.list.length + 1 });
    lines.push("", `**Spoonfed sentences:** ${fseen.length} seen${n ? ` of ${F.list.length}, ${n.due} due now, next new one is no. ${spoonfed.next}` : ""}.`);
    const batches = fresh.filter(e => e.t === "spoonfed" && !e.practice);
    if (batches.length) {
      const g = [0, 0, 0, 0, 0];
      batches.forEach(e => e.grades.forEach((x, i) => g[i] += x));
      lines.push(`Since last copy: ${g.reduce((a, b) => a + b)} answers (${SRS.GRADES.map((x, i) => `${x} ${g[i]}`).join(", ")}), ${batches.reduce((a, e) => a + e.new, 0)} new sentences.`);
    }
    const often = fseen.filter(([, c]) => c.lapses >= 2).sort((a, b) => b[1].lapses - a[1].lapses);
    often.forEach(([id, c]) => spoonfed.forgotten[F.byId[id] ? F.byId[id].hanzi : id] = c.lapses);
    if (often.length) lines.push(`**Spoonfed sentences often forgotten:** ${often.slice(0, 15).map(([id, c]) =>
      `${F.byId[id] ? F.byId[id].hanzi.replace(/\n/g, " ") : id} ${c.lapses}×`).join(" · ")}`);
  }

  const gdone = Object.entries(state.grammar).sort();
  if (gdone.length) {
    lines.push("", `**Grammar done:** ${gdone.map(([id, st]) => `${id} (${st.done}, best ${st.best}%, ${st.times}×)`).join(", ")}`);
    const checks = fresh.filter(e => e.t === "grammar");
    if (checks.length) lines.push(`Since last copy: ${checks.map(e => `${e.id} ${e.score}%`).join(", ")}`);
    const wrong = checks.flatMap(e => (e.wrong || []).map(w => `${e.id} ${w}`));
    if (wrong.length) { lines.push("Grammar mistakes since last copy:"); wrong.slice(0, 20).forEach(w => lines.push(`- ${w}`)); }
  }

  const data = { v: 1, copied: now, since, lessons: state.lessons, words, sentences, spoonfed, grammar: state.grammar, log: fresh };
  lines.push("", "```json", JSON.stringify(data), "```");
  return lines.join("\n");
}
async function copyProgress() {
  const text = progressReport();
  const msgs = view.querySelectorAll("[data-copy-msg]");
  const mark = () => { state.copiedAt = new Date().toISOString().slice(0, 19); save(); };
  try {
    await navigator.clipboard.writeText(text);
    mark();
    msgs.forEach(m => m.textContent = "Copied. Paste it into your chat with Claude.");
  } catch {
    // no clipboard access (e.g. some phones): show the text to copy by hand
    msgs.forEach(m => {
      m.innerHTML = `Select all and copy:<textarea readonly style="width:100%;height:160px;margin-top:6px;font:12px monospace">${esc(text)}</textarea>`;
      const ta = m.querySelector("textarea"); ta.focus(); ta.select();
    });
    mark();
  }
}

  const key = practice ? "pbatch" : "batch";
  const b = W[key] = W[key] || { total: 0, grades: [0, 0, 0, 0, 0], new: 0, ...(practice ? { practice: true } : {}) };
  b.total++; b.grades[grade - 1]++; if (isNew) b.new++;
  if (b.total >= 20) flushWords();
}

  if (!list.length) return back();
  const why = h => { const c = state.words[h];
    return !c ? `<span class="why">new</span>` : SRS.isParked(c) ? `<span class="why dk">Don't know ${c.dk}× · set aside</span>` : `<span class="why dk">Don't know</span>`; };
  keyHandler = e => { if (e.key === "Escape") back(); };
  list.forEach(h => audioFor(W.byHanzi[h].audio));
  view.innerHTML = `<div class="wtop"><a class="btn" href="#words">← Back</a><span class="muted small">${list.length} words to study</span></div>
    <div class="card">
      <table class="study"><thead><tr><th>Pinyin</th><th>Characters</th><th>English</th><th></th></tr></thead><tbody>
      ${list.map(h => { const w = W.byHanzi[h]; return `<tr>
        <td class="py">${esc(w.pinyin)}</td>
        <td class="hz" lang="zh-CN">${esc(h)}</td>
        <td>${esc(w.english)}${why(h)}</td>
        <td class="pl"><button class="btn" data-play="${w.audio}" title="Play">🔊</button></td></tr>`; }).join("")}
      </tbody></table>
      <button class="btn primary wide" id="wStudied">I've studied these</button>
      <p class="muted small" style="margin-bottom:0">Tap 🔊 to hear a word. When you know them, tap the button: new words come into your next session (<b>Start</b>), and words set aside come back.</p>
    </div>`;
  $("#wStudied").onclick = () => {
    const now = Date.now();
    for (const h of W.studyList) state.words[h] = SRS.study(state.words[h], now);
    logEvent({ t: "study", total: W.studyList.length, new: W.studyList.filter(h => !state.words[h].reps).length });
    save();
    back();
  };
}
function startWords() {
  W.session = { recent: [], current: null, flipped: false, done: 0, known: 0, fresh: 0 };
  nextWord();
}
// practice: today's Know words once more, in random order (see SRS.practiceWords)
function startPractice() {
  const queue = SRS.practiceWords(W.list, state.words, Date.now());
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  W.session = { practice: true, queue, words: queue.length, current: null, flipped: false, done: 0, known: 0, fresh: 0 };
  nextWord();
}
function nextWord() {
  const s = W.session;
  const next = s.practice
    ? (s.queue.length ? { word: s.queue.shift(), kind: "practice" } : null)
    : SRS.pickNext(W.list, state.words, Date.now(), s);
  if (!next) return renderWordsDone(true);
  s.current = next;
  s.flipped = false;
  renderWordCard();
  if (state.settings.autoplay) play(W.byHanzi[next.word].audio);
}
// the example sentence on the back of a word card, the word itself highlighted
function exampleBlock(ex) {
  const [a, b, c, d] = ex.mark;
  const hl = (t, i, j) => `${esc(t.slice(0, i))}<b>${esc(t.slice(i, j))}</b>${esc(t.slice(j))}`;
  return `<div class="wex"><div class="wex-top"><div><div class="wex-py">${hl(ex.pinyin, c, d)}</div>
    <div class="wex-hz" lang="zh-CN">${hl(ex.hanzi, a, b)}</div></div>
    ${ex.audio ? `<div class="btns"><button class="btn" data-play="${ex.audio}" title="Play the sentence">🔊</button>
      <button class="btn" data-slow="${ex.audio}" title="Slowly">🐢</button></div>` : ""}</div>
    <div class="wex-en">${esc(ex.english)}</div></div>`;
}
function renderWordCard() {
  const s = W.session, h = s.current.word, w = W.byHanzi[h], card = state.words[h];
  const n = SRS.counts(W.list, state.words, Date.now());
  const tag = s.practice ? (card.learning ? "Practice · once more" : "Practice")
    : { new: "New word", again: "Once more", due: "Review" }[s.current.kind];
  const flip = () => { if (!s.flipped) { s.flipped = true; renderWordCard(); } };
  view.innerHTML = `<div class="wtop"><button class="btn" id="wStop">✕ Stop</button>
      <span class="muted small">${s.practice ? `${s.done} done · ${s.queue.length + 1} left`
        : `${s.done} done · ${n.due} due${n.learning ? ` · ${n.learning} to try again` : ""}`}</span></div>
    <div class="card center wcard" id="wCard">
      <span class="tag">${tag}${card && card.lapses >= SRS.HARD ? " · ⚑ hard word" : ""}</span>
      <div class="row" style="margin-top:14px">
        <button class="btn bigplay" data-play="${w.audio}" title="Play again (P)">🔊</button>
        <button class="btn icon" data-slow="${w.audio}" title="Slowly">🐢</button></div>
      ${pinyinBlock(w)}
      <div class="hz" lang="zh-CN">${esc(w.hanzi)}</div>
      ${s.flipped ? `<hr><div class="big-en">${esc(w.english)}</div>
        ${w.example ? exampleBlock(w.example) : ""}
        ${typeof w.parts === "string" ? `<div class="chips parts" lang="zh-CN">${esc(w.parts)}</div>` : ""}
        ${Array.isArray(w.parts) ? `<div class="chips parts">${w.parts.map(x =>
          `<button class="chip" data-play="${x.audio}" title="Play ${esc(x.pinyin)}"><span class="hzf" lang="zh-CN">${esc(x.hanzi)}</span><span>${esc(x.pinyin)}</span><small>${esc(x.english)}</small></button>`).join("")}</div>` : ""}
        ${w.note ? `<div class="note">${esc(w.note)}</div>` : ""}
        ${w.audio_note ? `<div class="note">${esc(w.audio_note)}</div>` : ""}`
      : `<p class="muted small" style="margin:18px 0 0">Tap to see the English</p>`}
    </div>
    <div class="footer">${s.flipped
      ? `<div class="grades five" style="margin-top:0">${SRS.GRADES.map((g, i) =>
          `<button class="btn g${i + 1}" data-grade="${i + 1}">${g}<small>${s.practice ? SRS.practicePreview(card, i + 1) : SRS.preview(card, i + 1)}</small></button>`).join("")}</div>`
      : `<button class="btn primary wide" id="wShow">Show answer</button>`}</div>
    <div class="kbd center">${s.flipped ? "1–5: how well you knew it" : "Space: show answer"} · P: play again</div>`;
  [w.audio, w.example && w.example.audio, ...(Array.isArray(w.parts) ? w.parts.map(x => x.audio) : [])].forEach(audioFor);
  $("#wStop").onclick = () => renderWordsDone(false);
  $("#wCard").onclick = e => { if (!e.target.closest("button")) flip(); };
  if ($("#wShow")) $("#wShow").onclick = flip;
  view.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => gradeWord(+b.dataset.grade));
  keyHandler = e => {
    if (e.key === "p" || e.key === "P") play(w.audio);
    else if (!s.flipped && (e.key === " " || e.key === "Enter")) { e.preventDefault(); flip(); }
    else if (s.flipped && /^[1-5]$/.test(e.key)) gradeWord(+e.key);
  };
}
function gradeWord(grade) {
  const s = W.session, h = s.current.word, isNew = !state.words[h]?.reps;
  if (s.practice) {
    const c = state.words[h] = SRS.practice(state.words[h], grade, Date.now());
    save();
    logWordAnswer(grade, false, true);
    s.done++;
    if (grade >= 3) s.known++;
    // not known yet: once more after a few other words
    if (c.learning && !SRS.isParked(c)) s.queue.splice(Math.min(SRS.MIN_GAP, s.queue.length), 0, h);
    return nextWord();
  }
  state.words[h] = SRS.answer(state.words[h], grade, Date.now());
  save();
  logWordAnswer(grade, isNew);
  s.done++;
  if (grade >= 3) s.known++;
  if (isNew) s.fresh++;
  s.recent = [h, ...s.recent].slice(0, SRS.MIN_GAP);
  nextWord();
}
function renderWordsDone(allDone) {
  stopAudio();
  flushWords();
  const s = W.session;
  W.session = null;
  if (!s.done) return renderWords();
  const n = SRS.counts(W.list, state.words, Date.now());
  const back = () => renderWords();
  keyHandler = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); back(); } };
  view.innerHTML = `<div class="card center">
      <h3 style="margin-top:0">${s.practice ? (allDone ? "Practice done" : "Good work") : allDone ? "All done for now" : "Good work"}</h3>
      <div class="done-stats">
        <div><b>${s.done}</b><span class="muted small">cards</span></div>
        <div><b>${s.known}</b><span class="muted small">known</span></div>
        ${s.practice ? `<div><b>${s.words}</b><span class="muted small">words practised</span></div>`
          : `<div><b>${s.fresh}</b><span class="muted small">new words</span></div>`}
      </div>
      ${s.practice ? `<p class="muted small">Practice doesn't move words up: they still come back tomorrow.</p>` : ""}
      <p class="muted">${n.due || n.learning ? `Still waiting: ${[n.due && `${n.due} due`, n.learning && `${n.learning} to try again`].filter(Boolean).join(", ")}. They come first next time. ` : ""}By tomorrow: ${n.tomorrow} due.</p>
      ${n.parked ? `<p class="muted small">${n.parked} ${n.parked === 1 ? "word is" : "words are"} set aside after <i>Don't know</i> ${SRS.PARK_AT} times: study ${n.parked === 1 ? "it" : "them"} in <b>Study</b> to bring ${n.parked === 1 ? "it" : "them"} back.</p>` : ""}
      <button class="btn primary wide" id="wBack">Back</button>
    </div>`;
  $("#wBack").onclick = back;
}

// ---------- Sentences: translate whole sentences made of the words you've seen in Words (docs/sentences.json) ----------
// A sentence is ready once every one of its words has been seen in Words (studied or reviewed).
// You pick a group (new sentences, seen but not known yet, known) and get one sentence after
// another from it until you stop.
// Progress per sentence, by its audio id: { n: times done, ok: times Got it, last: last answer (1–3), day, at }
const S = { list: [], loading: null, session: null, batch: null };
// For now only the easy sentences ("easy" in data/sentences.json); false brings in all the others too
const S_EASY_ONLY = true;
const S_GRADES = ["Didn't get it", "Partly", "Got it"];
const S_GROUPS = {
  new: { name: "New sentences", done: "No more new sentences", hint: "ones you haven't had yet, the easiest first" },
  open: { name: "Seen, not known yet", done: "No more sentences to go over", hint: "the ones you said <i>Didn't get it</i> or <i>Partly</i> to last time" },
  known: { name: "Known", done: "No more known sentences", hint: "the ones you said <i>Got it</i> to, longest ago first" },
};
function loadSentences() {
  if (!S.loading) S.loading = Promise.all([loadWords(), fetch("sentences.json", { cache: "no-cache" }).then(r => r.json())]).then(([, d]) => {
    S.list = S_EASY_ONLY ? d.sentences.filter(x => x.easy) : d.sentences;
    for (const x of S.list) { x.words = [...new Set(x.tiles.map(t => t[0]))]; byId[x.audio] = byId[x.audio] || { v: x.v }; }
  }).catch(e => { S.loading = null; throw e; });
  return S.loading;
}
const onSentencesTab = () => (location.hash.slice(1) || "sounds").split("/")[0] === "sentences";
const sentenceReady = x => x.words.every(h => state.words[h]);
const sentDir = () => state.settings.sentDir === "en" ? "en" : "zh";
const sentenceGroup = x => { const c = state.sentences[x.audio]; return !c ? "new" : c.last === 3 ? "known" : "open"; };
function sentenceGroups() {
  const g = { new: [], open: [], known: [] };
  for (const x of S.list) if (sentenceReady(x)) g[sentenceGroup(x)].push(x);
  return g;
}
// The next sentence of a group, leaving out the ones shown in this session.
// New: the easy sentences first (short and simple, data/sentences.json "easy"), then the rest,
// easiest first: short ones, with few words that are still open in Words (Don't know, not yet
// known on a later day). Among sentences about as easy, the one whose words you've met least in
// sentences so far, so each word keeps coming in new sentences.
// Seen ones: the one done longest ago.
function nextSentenceOf(group, shown) {
  let pool = sentenceGroups()[group].filter(x => !shown.has(x.audio));
  if (!pool.length) return null;
  if (group !== "new") return pool.reduce((a, b) => (state.sentences[b.audio].at < state.sentences[a.audio].at ? b : a));
  if (pool.some(x => x.easy)) pool = pool.filter(x => x.easy);
  const met = {};
  for (const x of S.list) if (state.sentences[x.audio] || shown.has(x.audio)) for (const h of x.words) met[h] = (met[h] || 0) + 1;
  const open = h => SRS.isOpen(state.words[h]) ? 1 : 0;
  const variety = x => x.words.reduce((v, h) => v + 1 / (1 + (met[h] || 0)), 0) / Math.sqrt(x.words.length);
  const value = x => variety(x) - 0.25 * x.hanzi.replace(/[，。？！]/g, "").length - 0.5 * x.words.reduce((n, h) => n + open(h), 0);
  let best = null, bv = -1;
  for (const x of pool) { const v = value(x) + Math.random() * 0.05; if (v > bv) { best = x; bv = v; } }
  return best;
}
// answers go into the log for Claude in batches of 20, like the words
function logSentence(grade, x, mode, dir) {
  const b = S.batch = S.batch || { mode, dir, total: 0, grades: [0, 0, 0], wrong: [] };
  b.total++; b.grades[grade - 1]++;
  if (grade < 3) b.wrong.push(x.hanzi);
  if (b.total >= 20 || b.mode !== mode || b.dir !== dir) flushSentences();
}
function flushSentences() {
  if (!S.batch) return;
  logEvent({ t: "sentences", ...S.batch });
  S.batch = null;
  save();
}

function renderSentences() {
  if (!S.list.length) {
    keyHandler = null;
    view.innerHTML = `<div class="card center muted">Loading sentences…</div>`;
    loadSentences().then(() => { if (onSentencesTab()) renderSentences(); })
      .catch(() => { if (onSentencesTab()) view.innerHTML = `<div class="card center muted">Couldn't load the sentences. Check your connection and open the tab again.</div>`; });
    return;
  }
  if (S.session) return renderSentenceCard();
  flushSentences();
  const g = sentenceGroups(), ready = g.new.length + g.open.length + g.known.length;
  const easyLeft = g.new.filter(x => x.easy).length;
  const seen = W.list.filter(h => state.words[h]).length, dir = sentDir();
  // the sentences the next Study in Words would open
  const next = new Set(SRS.studyWords(W.list, state.words).filter(h => !state.words[h]));
  const soon = S.list.filter(x => !sentenceReady(x) && x.words.every(h => state.words[h] || next.has(h))).length;
  keyHandler = e => { const k = ["new", "open", "known"][+e.key - 1]; if (k && g[k].length) startSentences(k); };
  view.innerHTML = `<div class="card center">
      <div class="seg" role="group" aria-label="Translate">
        <button class="btn${dir === "zh" ? " on" : ""}" data-dir="zh">Chinese → English</button>
        <button class="btn${dir === "en" ? " on" : ""}" data-dir="en">English → Chinese</button>
      </div>
      <div class="sgroups">${Object.entries(S_GROUPS).map(([k, t], i) => `<button class="btn wide${i === 0 && g.new.length || i === 1 && !g.new.length && g.open.length ? " primary" : ""}" data-group="${k}" ${g[k].length ? "" : "disabled"}>
        <span>${t.name}<small>${k === "new" && easyLeft ? S_EASY_ONLY ? "easy ones you haven't had yet" : `${easyLeft} easy ${easyLeft === 1 ? "one" : "ones"} first, then the rest from the easiest` : t.hint}</small></span><b>${g[k].length}</b></button>`).join("")}</div>
      <p class="muted small" style="margin-bottom:0">${ready
        ? `${dir === "zh" ? "Hear and read a sentence and translate it into English" : "Read the English and say the sentence in Chinese"}, then tap to check and say how it went. One sentence after another, until you stop.`
        : `Every sentence is made of words from <b>Words</b>. A sentence comes in here once you've seen all its words there.`}</p>
    </div>
    <div class="card" style="margin-top:14px;padding:14px 16px">
      <div class="muted small">${ready} of ${S.list.length} ${S_EASY_ONLY ? "easy sentences" : "sentences"} use only the ${seen} words you've seen in <b>Words</b>${S_EASY_ONLY ? "" : ", and every word is in several of them"}.${soon && next.size
        ? ` <b>${soon} more</b> open once you've studied the next ${next.size} new words (<a href="#words/study">Study</a>).` : ""}</div>
    </div>`;
  view.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { state.settings.sentDir = b.dataset.dir; saveLocal(); renderSentences(); });
  view.querySelectorAll("[data-group]").forEach(b => b.onclick = () => startSentences(b.dataset.group));
}
function startSentences(mode) {
  S.session = { mode, dir: sentDir(), shown: new Set(), current: null, flipped: false, done: 0 };
  nextSentence();
}
function nextSentence() {
  const s = S.session, x = nextSentenceOf(s.mode, s.shown);
  if (!x) return renderSentencesDone();
  s.current = x;
  s.flipped = false;
  s.shown.add(x.audio);
  renderSentenceCard();
  if (s.dir === "zh" && state.settings.autoplay) play(x.audio);
  const after = nextSentenceOf(s.mode, s.shown);   // preload the next one
  if (after) audioFor(after.audio);
}
function renderSentenceCard() {
  const s = S.session, x = s.current, zhFirst = s.dir === "zh";
  const left = sentenceGroups()[s.mode].filter(y => !s.shown.has(y.audio)).length;
  const flip = () => { if (!s.flipped) { s.flipped = true; renderSentenceCard(); if (!zhFirst) play(x.audio); } };
  const chinese = `<div class="spy">${esc(x.pinyin)}</div>${state.settings.numbers ? `<div class="num">${esc(x.numbers)}</div>` : ""}
      <div class="shz hzf" lang="zh-CN">${esc(x.hanzi)}</div>`;
  const playBtns = `<div class="row" style="margin-top:12px"><button class="btn bigplay" data-play="${x.audio}" title="Play again (P)">🔊</button>
      <button class="btn icon" data-slow="${x.audio}" title="Slowly">🐢</button></div>`;
  const words = x.tiles.map(([h, said]) => {
    const w = W.byHanzi[h], weak = SRS.isOpen(state.words[h]);
    return `<button class="chip${weak ? " weak" : ""}" data-play="${w.audio}" title="Play ${esc(w.pinyin)}${weak ? " (still open in Words)" : ""}">
      <span class="hzf" lang="zh-CN">${esc(h)}</span><span>${esc(said)}</span><small>${esc(w.english.split(/[;(]/)[0].trim() || w.english)}</small></button>`;
  }).join("");
  const c = state.sentences[x.audio];
  const front = zhFirst ? `${playBtns}${chinese}` : `<div class="big-en">${esc(x.english)}</div>`;
  const back = zhFirst ? `<hr><div class="big-en">${esc(x.english)}</div>` : `<hr>${playBtns}${chinese}`;
  view.innerHTML = `<div class="wtop"><button class="btn" id="sStop">✕ Stop</button>
      <span class="muted small">${S_GROUPS[s.mode].name} · ${s.done} done · ${left} left</span></div>
    <div class="card center wcard scard" id="sCard">
      <span class="tag">${zhFirst ? "Translate into English" : "Say it in Chinese"}${c ? ` · last time: ${S_GRADES[c.last - 1]}` : ""}</span>
      ${front}
      ${s.flipped ? `${back}<div class="chips swords">${words}</div>
        <p class="muted small" style="margin:10px 0 0">Tap a word to hear it.${x.tiles.some(([h]) => SRS.isOpen(state.words[h])) ? " Underlined: still open in Words." : ""}</p>`
      : `<p class="muted small" style="margin:18px 0 0">${zhFirst ? "Translate it in your head or out loud" : "Say it out loud, or write it down"}, then tap to check</p>`}
    </div>
    <div class="footer">${s.flipped
      ? `<div class="grades three" style="margin-top:0">${S_GRADES.map((g, i) => `<button class="btn g${[1, 2, 4][i]}" data-sgrade="${i + 1}">${g}</button>`).join("")}</div>`
      : `<button class="btn primary wide" id="sShow">Show answer</button>`}</div>
    <div class="kbd center">${s.flipped ? "1–3: how it went" : "Space: show answer"} · P: play</div>`;
  if (s.flipped) x.tiles.forEach(([h]) => audioFor(W.byHanzi[h].audio));
  $("#sStop").onclick = stopSentences;
  $("#sCard").onclick = e => { if (!e.target.closest("button")) flip(); };
  if ($("#sShow")) $("#sShow").onclick = flip;
  view.querySelectorAll("[data-sgrade]").forEach(b => b.onclick = () => gradeSentence(+b.dataset.sgrade));
  keyHandler = e => {
    if ((e.key === "p" || e.key === "P") && (zhFirst || s.flipped)) play(x.audio);
    else if (!s.flipped && (e.key === " " || e.key === "Enter")) { e.preventDefault(); flip(); }
    else if (s.flipped && /^[1-3]$/.test(e.key)) gradeSentence(+e.key);
  };
}
function gradeSentence(grade) {
  const s = S.session, x = s.current;
  stopAudio();
  const o = state.sentences[x.audio] || { n: 0, ok: 0 };
  state.sentences[x.audio] = { n: o.n + 1, ok: o.ok + (grade === 3 ? 1 : 0), last: grade,
                               day: SRS.dayOf(Date.now()), at: new Date().toISOString().slice(0, 19) };
  save();
  logSentence(grade, x, s.mode, s.dir);
  s.done++;
  nextSentence();
}
function stopSentences() {
  stopAudio();
  S.session = null;
  flushSentences();
  renderSentences();
}
function renderSentencesDone() {
  const s = S.session;
  S.session = null;
  flushSentences();
  keyHandler = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); renderSentences(); } };
  view.innerHTML = `<div class="card center">
      <h3 style="margin-top:0">${S_GROUPS[s.mode].done}</h3>
      <p class="muted">${s.done ? `You did ${s.done} ${s.done === 1 ? "sentence" : "sentences"}. ` : ""}${s.mode === "new"
        ? "Study more words in <b>Words</b> to open new sentences." : "Pick another group to go on."}</p>
      <button class="btn primary wide" id="sBack">Back</button>
    </div>`;
  $("#sBack").onclick = renderSentences;
}

// ---------- Spoonfed: the sentences of the Anki deck Spoonfed Chinese, in the deck's order, as flashcards like Words ----------
// docs/spoonfed.json (built by tools/spoonfed.py). Same rules as the words (srs.js): sessions only ask
// sentences you've studied or seen, and Study brings the next 10 of the deck.
// Progress per sentence, by its id, in state.spoonfed (same fields as a word, see srs.js).
const F = { list: [], byId: {}, glosses: {}, loading: null, session: null, batch: null, pbatch: null };
function loadSpoonfed() {
  if (!F.loading) F.loading = Promise.all([loadWords().catch(() => {}), fetch("spoonfed.json", { cache: "no-cache" }).then(r => r.json())]).then(([, d]) => {
    F.glosses = d.glosses;
    d.sentences.forEach((x, i) => {
      x.id = String(x.id); x.n = i + 1;
      F.byId[x.id] = x;
      if (x.audio) byId[x.audio] = { v: x.v };
    });
    F.list = d.sentences.map(x => x.id);
  }).catch(e => { F.loading = null; throw e; });
  return F.loading;
}
const onSpoonfedTab = () => (location.hash.slice(1) || "sounds").split("/")[0] === "spoonfed";
function logSpoonfed(grade, isNew, practice) {

  const b = F[key] = F[key] || { total: 0, grades: [0, 0, 0, 0, 0], new: 0, ...(practice ? { practice: true } : {}) };

function flushSpoonfed() {

const hardSentences = () => F.list.filter(id => (state.spoonfed[id]?.lapses || 0) >= SRS.HARD);

const sfGloss = ([h, p]) => F.glosses[`${h} ${p}`] || "";

function startSpoonfed() {

function startSpoonfedPractice() {

}
function nextSpoonfed() {
  const s = F.session;
  const next = s.practice
    ? (s.queue.length ? { word: s.queue.shift(), kind: "practice" } : null)
    : SRS.pickNext(F.list, state.spoonfed, Date.now(), s);

function renderSpoonfedCard() {

    : { new: "New sentence", again: "Once more", due: "Review" }[s.current.kind];

      : `<button class="btn primary wide" id="fShow">Show answer</button>`}</div>
    <div class="kbd center">${s.flipped ? "1–5: how well you knew it" : "Space: show answer"} · P: play again</div>`;
  if (s.flipped) x.words.forEach(([h]) => W.byHanzi[h] && audioFor(W.byHanzi[h].audio));

function gradeSpoonfed(grade) {
  const s = F.session, id = s.current.word, isNew = !state.spoonfed[id]?.reps;
  stopAudio();
  if (s.practice) {
    const c = state.spoonfed[id] = SRS.practice(state.spoonfed[id], grade, Date.now());
    save();
    logSpoonfed(grade, false, true);
    s.done++;
    if (grade >= 3) s.known++;
    if (c.learning && !SRS.isParked(c)) s.queue.splice(Math.min(SRS.MIN_GAP, s.queue.length), 0, id);
    return nextSpoonfed();
  }
  state.spoonfed[id] = SRS.answer(state.spoonfed[id], grade, Date.now());
  save();
  logSpoonfed(grade, isNew);
  s.done++;
  if (grade >= 3) s.known++;
  if (isNew) s.fresh++;
  s.recent = [id, ...s.recent].slice(0, SRS.MIN_GAP);
  nextSpoonfed();
}
function renderSpoonfedDone(allDone) {

// ---------- Grammar: one topic per session, in HSK order (docs/grammar.json, built from data/grammar/) ----------
const G = { plan: [], sessions: {}, loading: null, quiz: null };
function loadGrammar() {
  if (!G.loading) G.loading = fetch("grammar.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
    G.plan = d.plan;
    const reg = x => { if (x && x.audio) byId[x.audio] = byId[x.audio] || { v: x.v }; };
    for (const s of d.sessions) {
      G.sessions[s.id] = s;
      s.blocks.forEach(b => (b.ex || []).forEach(reg));
      s.exercises.forEach(q => reg(q.sentence));
      s.words.forEach(reg);
    }
  }).catch(e => { G.loading = null; throw e; });
  return G.loading;
}
const onGrammarTab = () => (location.hash.slice(1) || "learn").split("/")[0] === "grammar";
// **bold** and *italic* inside a line
const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
// Chinese characters inside English text get the Chinese font
const zh = html => html.replace(/[一-鿿，。？！、＿]+/g, m => `<span class="hzf" lang="zh-CN">${m}</span>`);
// text with [start, end] ranges in bold (the grammar point of an example)
function marked(text, ranges) {
  let out = "", pos = 0;
  for (const [a, b] of [...ranges].sort((x, y) => x[0] - y[0])) { out += esc(text.slice(pos, a)) + `<b>${esc(text.slice(a, b))}</b>`; pos = b; }
  return out + esc(text.slice(pos));
}

function renderGrammar(id, sub) {
  if (!G.plan.length) {
    keyHandler = null;
    view.innerHTML = `<div class="card center muted">Loading grammar…</div>`;
    loadGrammar().then(() => { if (onGrammarTab()) renderGrammar(id, sub); })
      .catch(() => { if (onGrammarTab()) view.innerHTML = `<div class="card center muted">Couldn't load the grammar. Check your connection and open the tab again.</div>`; });
    return;
  }
  const s = G.sessions[id];
  if (s && sub === "check") return startGrammarQuiz(s);
  if (s) return renderGrammarSession(s);
  renderGrammarList();
}

function renderGrammarList() {
  keyHandler = null;
  const next = G.plan.find(t => t.built && !state.grammar[t.id]);
  const row = (t, n) => {
    const head = `<div class="t">${zh(esc(t.title))}</div><div class="muted small">${zh(esc(t.focus))}</div>`;
    if (!t.built) return `<div class="lrow planned"><span class="ic">${n}</span><div class="main">${head}</div></div>`;
    const s = G.sessions[t.id], st = state.grammar[t.id];
    const seen = s.words.filter(w => state.words[w.hanzi]).length;
    return `<a class="lrow${st ? " done" : ""}${t === next ? " next" : ""}" href="#grammar/${t.id}">
      <span class="ic">${st ? "✓" : n}</span>
      <div class="main">${head}<div class="muted small">${st ? `Best ${st.best}% · ` : ""}${seen} of ${s.words.length} words seen in Words</div></div>
      <span class="go">${t === next ? "Start" : st ? "Again" : "Open"}</span></a>`;
  };
  const levels = [...new Set(G.plan.map(t => t.hsk))];
  view.innerHTML = `<div class="card" style="padding:14px 16px"><b>One topic per session</b>
      <div class="muted small">In the order of the HSK levels. Each session explains one topic with examples you can play, then checks it with a few questions. The examples use words from <b>Words</b>: early topics only the most common ones, later topics words further down the list.</div></div>` +
    levels.map(h => {
      const ts = G.plan.filter(t => t.hsk === h);
      const list = `<div class="list">${ts.map(t => row(t, G.plan.indexOf(t) + 1)).join("")}</div>`;
      return ts.some(t => t.built) ? `<div class="topic"><h2>HSK ${h}</h2>${list}</div>`
        : `<details class="later"><summary>HSK ${h} · ${ts.length} topics, coming later</summary>${list}</details>`;
    }).join("");
}

function exampleHtml(x) {
  const hz = (x.mark || []).map(m => [m[0], m[1]]), py = (x.mark || []).map(m => [m[2], m[3]]);
  return `<div class="gex"><div class="btns"><button class="btn" data-play="${x.audio}" title="Play">🔊</button>
      <button class="btn" data-slow="${x.audio}" title="Slowly">🐢</button></div>

const wrongHtml = x => `<div class="gex bad"><span class="gx" title="wrong">✗</span>
  <div class="main"><div class="gex-py">${esc(x.pinyin)}</div><div class="gex-hz hzf" lang="zh-CN">${esc(x.hanzi)}</div>
    <div class="gex-why">${zh(inline(x.why))}</div></div></div>`;
// the words of a session: seen in Words, or still to come there
function grammarWords(s) {
  const seen = s.words.filter(w => state.words[w.hanzi]).length;
  const status = w => state.words[w.hanzi] ? `<span class="s ok">✓ seen</span>`
    : w.new ? `<span class="s new">new here</span>` : w.pos ? `<span class="s">#${w.pos} in Words</span>` : `<span class="s">not in Words</span>`;
  return `<details class="gwords"><summary>Words in this session: ${seen} of ${s.words.length} seen</summary>
    <div class="gwlist">${s.words.map(w => `<div class="gw"><div class="w"><span class="hzf" lang="zh-CN">${esc(w.hanzi)}</span>
      <span class="p">${esc(w.pinyin)}</span></div><div class="e">${esc(w.english)}${status(w)}</div>
      <button class="btn" data-play="${w.audio}" title="Play">🔊</button></div>`).join("")}</div>
    <p class="muted small" style="margin-bottom:0"><b>✓ seen</b>: you've had it in Words. <b>#</b>: its place in the word list, so it comes up in Words later. <b>New here</b>: a word this session brings in early.</p></details>`;
}
function renderGrammarSession(s) {
  const st = state.grammar[s.id];
  const blocks = s.blocks.map(b => b.h ? `<h3>${zh(esc(b.h))}</h3>`
    : b.text ? zh(fmt(b.text))
    : b.pattern ? `<div class="gpat"><div class="gpat-f">${zh(esc(b.pattern))}</div>${b.english ? `<div class="gpat-en">${esc(b.english)}</div>` : ""}</div>`
    : b.tip ? `<div class="gtip">${zh(fmt("💡 " + b.tip))}</div>`
    : b.ex ? b.ex.map(exampleHtml).join("")
    : b.wrong ? b.wrong.map(wrongHtml).join("") : "").join("");
  view.innerHTML = `<div class="wtop"><a class="btn" href="#grammar">← All topics</a>
      <span class="muted small">${st ? `✓ done · best ${st.best}%` : ""}</span></div>
    <div class="card gsession"><span class="tag">HSK ${s.hsk} · ${s.id}</span>
      <h2 class="gtitle">${zh(esc(s.title))}</h2><p class="ggoal">${zh(inline(s.goal))}</p>
      ${grammarWords(s)}${blocks}</div>
    <div class="footer"><a class="btn primary wide" href="#grammar/${s.id}/check">Check yourself: ${s.exercises.length} questions</a></div>`;
  keyHandler = e => { if (e.key === "Enter") location.hash = `#grammar/${s.id}/check`; };
  window.scrollTo(0, 0);
}

// The check at the end of a session. A question answered wrong comes back once at the end;
// the score counts the questions right the first time.
function startGrammarQuiz(s) {
  G.quiz = { s, queue: s.exercises.map((q, i) => ({ q, i, tries: 0 })), pos: 0, wrong: new Set(), notes: [] };
  s.exercises.forEach(q => audioFor(q.sentence.audio));   // preload
  renderGrammarQ();
}
function renderGrammarQ() {
  keyHandler = null;
  const Q = G.quiz;
  if (Q.pos >= Q.queue.length) return finishGrammarQuiz();
  const entry = Q.queue[Q.pos];
  view.innerHTML = `<div class="ltop"><button class="btn ghost" id="quit" title="Back to the explanation">✕</button>
      <div class="progress"><div style="width:${100 * Q.pos / Q.queue.length}%"></div></div></div>
    <div class="card step" id="card"></div><div class="footer" id="footer"></div>`;
  $("#quit").onclick = () => { location.hash = `#grammar/${Q.s.id}`; };
  window.scrollTo(0, 0);
  GQ[entry.q.type](entry.q, entry);
}
function nextGrammarQ() { stopAudio(); G.quiz.pos++; renderGrammarQ(); }
const grammarReveal = q => { const x = q.sentence; return `<div class="fbsent">
  <div class="p">${esc(x.pinyin)} <button class="btn icon" data-play="${x.audio}" title="Play (P)">🔊</button></div>
  <div class="hzf" lang="zh-CN">${esc(x.hanzi)}</div><div class="muted">${esc(x.english)}</div></div>
  ${q.explain ? `<div class="fbexplain">${zh(inline(q.explain))}</div>` : ""}`; };
function grammarJudge(entry, ok, playId) {
  const Q = G.quiz, q = entry.q;
  if (!ok) {
    if (!Q.wrong.has(entry.i)) {
      const g = entry.given, o = q.options && q.options[+g];
      const got = q.type === "order" ? g : q.type === "meaning" ? o : q.type === "gap" ? `${o.hanzi} ${o.pinyin}` : o.hanzi;
      Q.notes.push(`${q.type}: ${q.sentence.hanzi} (${q.sentence.english}) → ${got}`);
    }
    Q.wrong.add(entry.i);
    if (entry.tries < 1) Q.queue.push({ ...entry, tries: entry.tries + 1 });
  }
  const f = $("#footer");
  f.className = "footer " + (ok ? "ok" : "no");
  f.innerHTML = `<div class="fbhead">${ok ? "✓ Correct!" : "✗ Not quite"}</div>${grammarReveal(q)}
    <button class="btn primary wide" id="go">Continue</button>`;
  $("#go").onclick = nextGrammarQ;
  $("#go").focus();
  if (playId) play(playId);
  keyHandler = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nextGrammarQ(); }
    else if (e.key === "p" || e.key === "P") play(q.sentence.audio);
  };
}
const GQ = {
  order(q, entry) {
    const x = q.sentence, tiles = x.tiles, plain = h => h.replace(/[，。？！：；、]/g, "");
    let bank = shuffle(tiles.map((t, k) => k));
    for (let n = 0; n < 5 && bank.every((k, i) => tiles[k][0] === tiles[i][0]); n++) bank = shuffle(bank);   // not already in order
    const chosen = [];
    $("#card").innerHTML = `<span class="tag">put the words in order</span><div class="big-en">${esc(x.english)}</div>
      <div class="answer" id="ans"></div><div class="bank" id="bank"></div>`;
    const tile = (k, cls, attr) => `<button class="tile gtile${cls}" ${attr}>${esc(tiles[k][1])}<small class="hzf" lang="zh-CN">${esc(tiles[k][0])}</small></button>`;
    const audioOf = h => (G.quiz.s.words.find(w => w.hanzi === h) || {}).audio;
    let done = false;
    const go = footerButton("Check", () => check(), true);
    const draw = () => {
      $("#ans").innerHTML = chosen.map((k, n) => tile(k, "", `data-n="${n}"`)).join("");
      $("#bank").innerHTML = bank.map(k => tile(k, chosen.includes(k) ? " used" : "", `data-k="${k}"`)).join("");
      $("#ans").querySelectorAll(".tile").forEach(t => t.onclick = () => { if (!done) { chosen.splice(+t.dataset.n, 1); draw(); } });
      $("#bank").querySelectorAll(".tile").forEach(t => t.onclick = () => {
        const k = +t.dataset.k;
        if (done || chosen.includes(k)) return;
        chosen.push(k);
        if (audioOf(tiles[k][0])) play(audioOf(tiles[k][0]));
        draw();
      });
      go.disabled = !chosen.length;
    };
    const check = () => {
      if (done || !chosen.length) return; done = true;
      const given = chosen.map(k => tiles[k][0]).join("");
      entry.given = given;
      grammarJudge(entry, chosen.length === tiles.length && [x.hanzi, ...q.also].some(h => plain(h) === given), x.audio);
    };
    draw();
    keyHandler = e => { if (e.key === "Enter") check(); else if (e.key === "Backspace" && chosen.length && !done) { chosen.pop(); draw(); } };
  },
  gap(q, entry) {
    const opts = shuffle(q.options.map((o, k) => ({ ...o, k })));
    const [hzA, hzB] = q.hanzi.split("＿"), [pyA, pyB] = q.pinyin.split("＿");
    $("#card").innerHTML = `<span class="tag">fill the gap</span><div class="big-en">${esc(q.english)}</div>
      <div class="gq-sent"><div class="py">${esc(pyA)}<span class="gq-gap">&nbsp;</span>${esc(pyB)}</div>
        <div class="hzf" lang="zh-CN">${esc(hzA)}<span class="gq-gap">&nbsp;</span>${esc(hzB)}</div></div>
      <div class="options${opts.length === 3 ? " three" : ""}">${opts.map(o =>
        `<button class="btn gopt" data-k="${o.k}"><span class="hzf" lang="zh-CN">${esc(o.hanzi)}</span><small>${esc(o.pinyin)}</small></button>`).join("")}</div>`;
    choose(entry, k => k === "0", ok => grammarJudge(entry, ok, q.sentence.audio));
  },
  pick(q, entry) {
    const opts = shuffle(q.options.map((o, k) => ({ ...o, k })));
    $("#card").innerHTML = `<span class="tag">which is right?</span><div class="big-en">${esc(q.english)}</div>
      <div class="options one">${opts.map(o =>
        `<button class="btn gsent" data-k="${o.k}"><span>${esc(o.pinyin)}</span><span class="hzf" lang="zh-CN">${esc(o.hanzi)}</span></button>`).join("")}</div>`;
    choose(entry, k => k === "0", ok => grammarJudge(entry, ok, q.sentence.audio));
  },
  meaning(q, entry) {
    const x = q.sentence, opts = shuffle(q.options.map((o, k) => ({ o, k })));
    entry.audio = x.audio;
    $("#card").innerHTML = `<span class="tag">what does it mean?</span>${bigPlay(x.audio)}
      <div class="gq-sent"><div class="py">${esc(x.pinyin)}</div><div class="hzf" lang="zh-CN">${esc(x.hanzi)}</div></div>
      <div class="options one text">${opts.map(({ o, k }) => `<button class="btn" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
    play(x.audio);
    choose(entry, k => k === "0", ok => grammarJudge(entry, ok, null));
  },
};
function finishGrammarQuiz() {
  const Q = G.quiz, s = Q.s, n = s.exercises.length;
  if (!Q.finished) {   // record once
    Q.finished = true;
    Q.score = Math.round(100 * (n - Q.wrong.size) / n);
    const st = state.grammar[s.id], at = nowIso();
    state.grammar[s.id] = st ? { ...st, last: today(), best: Math.max(st.best, Q.score), times: st.times + 1, at }
                             : { done: today(), last: today(), best: Q.score, times: 1, at };
    logEvent({ t: "grammar", id: s.id, score: Q.score, wrong: Q.notes });
    save();
  }
  stopAudio();
  const i = G.plan.findIndex(t => t.id === s.id), next = G.plan.slice(i + 1).find(t => t.built);
  view.innerHTML = `<div class="card center"><span class="tag">HSK ${s.hsk} · ${s.id}</span><h3>${zh(esc(s.title))}</h3>
      <div class="done-stats">
        <div><b>${Q.score}%</b><span class="muted small">right first time</span></div>
        <div><b>${n - Q.wrong.size} of ${n}</b><span class="muted small">questions</span></div>
        <div><b>${state.grammar[s.id].best}%</b><span class="muted small">your best</span></div>
      </div>
      <p class="muted">${Q.score >= 80 ? "Well done." : "Read the explanation again, and check yourself once more, maybe tomorrow."}</p>
      ${next ? `<a class="btn primary wide" href="#grammar/${next.id}"><span>Next: ${zh(esc(next.title))}</span></a>` : ""}
      <div class="row"><a class="btn" href="#grammar/${s.id}">Read again</a><a class="btn" href="#grammar">All topics</a></div>
    </div>`;
  keyHandler = e => { if (e.key === "Enter" && next) location.hash = `#grammar/${next.id}`; };
}

// ---------- Sounds: each lesson's explanations and all its sounds, to read and listen ----------
function renderSounds(id) {
  const lesson = DATA.lessons.find(l => l.id === id);
  if (lesson) return renderSoundsLesson(lesson);
  keyHandler = null;
  const next = DATA.lessons.find(l => !state.lessons[l.id]);
  const row = p => {
    if (!p.built) return `<div class="lrow planned"><span class="ic">${+p.id.slice(1)}</span>
      <div class="main"><div class="t">${esc(p.title)}</div><div class="muted small">${esc(p.focus)}</div></div></div>`;
    const l = DATA.lessons.find(x => x.id === p.id), st = state.lessons[p.id];
    const cls = st ? "done" : l === next ? "next" : "";
    return `<a class="lrow ${cls}" href="#sounds/${p.id}">
      <span class="ic">${st ? "✓" : +p.id.slice(1)}</span>
      <div class="main"><div class="t">${esc(l.title)}</div>
        <div class="muted small">${esc(l.focus)}</div>
        <div class="muted small">${esc(p.id)} · ${esc(p.chart)}${st ? " · done" : ""}</div></div>
      <span class="go">Read</span></a>`;
  };
  const topics = DATA.topics.map(t => ({ ...t, rows: DATA.plan.filter(p => p.topic === t.id) }));
  const started = topics.filter(t => t.rows.some(p => p.built));
  const later = topics.filter(t => !t.rows.some(p => p.built));
  view.innerHTML = `<p class="muted lead" style="margin-top:0">How Mandarin sounds, lesson by lesson, along the Pinyin chart: what to listen for, how to make each sound, and every sound in all four tones. Then practise them in <a href="#exercises" style="color:var(--accent)">Exercises</a>.</p>` +
    started.map(t => `<div class="topic">
      <h2>${esc(t.title)}</h2>
      <div class="muted small" style="margin-bottom:10px">${t.rows.filter(p => p.built).length} of ${t.rows.length} lessons ready</div>
      <div class="list">${t.rows.map(row).join("")}</div></div>`).join("") +
    (later.length ? `<details class="later"><summary>Coming later: ${later.reduce((n, t) => n + t.rows.length, 0)} more lessons</summary>${
      later.map(t => `<div class="topic"><h2>${esc(t.title)}</h2><div class="list">${t.rows.map(row).join("")}</div></div>`).join("")}</details>` : "") +
    `<p class="muted small center" style="margin-top:24px">More lessons are added as you go.</p>`;
}
// a chart step as a table: syllables down, tones across; a row or column header plays the whole line
const chartGrid = s => `<div class="chart" style="grid-template-columns: auto repeat(${s.tones.length}, 1fr)"><span></span>${
  s.tones.map(t => `<button class="chead" data-seq="${s.syllables.map(b => soundId(b, t)).join(" ")}" title="Play the column">${toneSvg(t, 34)}<span>${TONE_NAME[t]}</span></button>`).join("")}${
  s.syllables.map(b => `<button class="rhead" data-seq="${s.tones.map(t => soundId(b, t)).join(" ")}" title="Play the row">${esc(b)} ▶</button>` +
    s.tones.map(t => `<button class="ccell" data-play="${soundId(b, t)}">${esc(byId[soundId(b, t)].pinyin)}</button>`).join("")).join("")}</div>`;
function renderSoundsLesson(l) {
  keyHandler = null;
  const n = DATA.lessons.indexOf(l), prev = DATA.lessons[n - 1], next = DATA.lessons[n + 1];

    ${(s.rows || []).map(r => sylRow(r)).join("")}${s.type === "chart" ? chartGrid(s) : ""}</div>`;
  // sounds of the lesson not shown above, one row per syllable

  const more = {};
  for (const i of lessonTaught(l).filter(i => !shown.has(i.id))) (more[i.syllables[0][0]] ||= []).push(i.id);
  const st = state.lessons[l.id];
  view.innerHTML = `<div class="wtop"><a class="btn" href="#sounds">← All lessons</a>
      <span class="muted small">${esc(l.id)}${st ? ` · ✓ done, best ${st.best}%` : ""}</span></div>
    <h2 class="ltitle">${esc(l.title)}</h2><p class="muted" style="margin-top:0">${esc(l.focus)}</p>
    <div class="list">${secs.map(section).join("")}${Object.keys(more).length ? `<div class="card sec"><h3>More sounds of this lesson</h3>${
      Object.values(more).map(ids => sylRow(ids.sort())).join("")}</div>` : ""}
    <div class="card center"><a class="btn primary wide" href="#exercises/${l.id}">Exercises for ${esc(l.id)}</a>
      <p class="muted small" style="margin-bottom:0">${ROUND} listening exercises on these sounds, different every time.
      <a href="${GITHUB}lessons/${l.file}" target="_blank" rel="noopener" style="color:var(--accent)">Lesson notes ↗</a></p></div></div>
    <div class="row">${prev ? `<a class="btn" href="#sounds/${prev.id}">← ${esc(prev.id)}</a>` : ""}${next ? `<a class="btn" href="#sounds/${next.id}">${esc(next.id)} →</a>` : ""}</div>`;
  window.scrollTo(0, 0);
